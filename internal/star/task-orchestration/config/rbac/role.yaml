---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - artifactdeployments
  - stageversionusages
  - taskexecutions
  - vectormigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - artifactdeployments/status
  - stageversionusages/status
  - taskexecutions/status
  - vectormigrations/status
  verbs:
  - get
  - patch
  - update
