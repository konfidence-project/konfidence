# VectorTemplate promotions do not require approval.
apiVersion: konfidence.cloud/v1alpha1
kind: VectorPromotionConfig
metadata:
  name: example-app
  namespace: kden-p-example-app
spec:
  source:
    kind: VectorTemplate
    name: example-app
  target:
    kind: Stage
    name: dev
    landscape: dev
---
apiVersion: konfidence.cloud/v1alpha1
kind: VectorPromotionConfig
metadata:
  name: dev-to-prod
  namespace: kden-p-example-app
spec:
  source: {kind: Stage, name: dev, landscape: dev}
  target: {kind: Stage, name: prod, landscape: dev}
  gates:
    - type: explicit-approval.konfidence.cloud
