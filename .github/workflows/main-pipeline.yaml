name: Main

on:
  push:
    branches:
      - main

jobs:
  lint-test-build:
    name: Main
    # Skip when the release script pushes a chart version bump commit — the release
    # pipeline handles building and publishing for those commits via the semver tag
    # that is pushed in the same release.sh invocation.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: konfidence-project/konfidence/.github/workflows/lint-test-build.yaml@main
    secrets: inherit
    with:
      mode: main
      snapshot-tag: ${{ github.sha }}
