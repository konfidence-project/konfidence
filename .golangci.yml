version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    lll:
      line-length: 160
    goimports:
      local-prefixes: konfidence.cloud
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      # Exclude generated files from all linters
      - path: "zz_generated\\.deepcopy\\.go"
        linters:
          - unused
          - ineffassign
          - revive
      # Exclude API types from certain linters (they're mostly struct definitions)
      - path: "api/.*/.*types\\.go"
        linters:
          - revive
          - unused
      # Allow dot-imports in test files (conventional for ginkgo/gomega)
      - path: "_test\\.go"
        text: "should not use dot imports"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
