{{- if .Values.installCRDs -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- include "star.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
    {{- include "star.crdLabels" . | nindent 4 }}
  name: vectorassignments.star.konfidence.cloud
spec:
  group: star.konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: VectorAssignment
    listKind: VectorAssignmentList
    plural: vectorassignments
    singular: vectorassignment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The name of the ArtifactDeployment
      jsonPath: .spec.artifactDeploymentRef.name
      name: Artifact-Deployment
      type: string
    - description: The name of the VectorDeployment
      jsonPath: .spec.vectorDeploymentRef.name
      name: Vector-Deployment
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VectorAssignment is the Schema for the vectorassignments API.

          A VectorAssignment represents a single binding between a VectorDeployment and an ArtifactDeployment. It enables
          an n:m mapping where a single artifact may be reused across multiple vectors. These objects are automatically
          managed by the vector-deployment-controller and reconciled by deployers to apply vector-specific configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the VectorAssignment and
              is immutable after it has been set
            properties:
              artifactDeploymentRef:
                description: |-
                  ArtifactDeploymentRef references the ArtifactDeployment instance that is associated with the vector. The
                  referenced artifact must exist in the same namespace as this VectorAssignment.
                properties:
                  name:
                    description: "Name\tis the name of the ArtifactDeployment. Required."
                    type: string
                required:
                - name
                type: object
              manifest:
                description: |-
                  Manifest contains the ArtifactManifest describing the artifact to be assigned to the vector. This duplicates the
                  manifest stored in the ArtifactDeployment for efficiency: deployers often need to filter or select assignments
                  by artifact type, and embedding the manifest avoids repeated API lookups.
                properties:
                  allowReuse:
                    description: |-
                      AllowReuse indicates whether the deployed artifact instance may be shared across multiple VectorDeployments.
                      Reuse allows more efficient resource consumption but requires the artifact to be independent of vector-specific
                      runtime context.
                    type: boolean
                  type:
                    description: |-
                      Type specifies the deployer that should handle this artifact (e.g., "cloud.konfidence.flux.helm",
                      "cloud.konfidence.flux.kustomize", or any custom deployer type). Deployers implement their own interpretation
                      of the artifact's contents.
                    type: string
                required:
                - allowReuse
                - type
                type: object
              vectorDeploymentRef:
                description: |-
                  VectorDeploymentRef references the VectorDeployment that this artifact is assigned to. This creates the explicit
                  mapping "artifact X belongs to vector Y".
                properties:
                  name:
                    description: "Name\tis the name of the VectorDeployment. Required."
                    type: string
                required:
                - name
                type: object
            required:
            - artifactDeploymentRef
            - manifest
            - vectorDeploymentRef
            type: object
            x-kubernetes-validations:
            - message: VectorAssignment spec is immutable after it has been set
              rule: self == oldSelf
          status:
            description: |-
              VectorAssignmentStatus defines the observed state of a VectorAssignment.

              A VectorAssignment progresses through a simple lifecycle driven by the deployer:

               1. VectorAssignment is created by the vector-deployment-controller.
               2. deployer reconciles it and configures vector-specific integration
               3. VectorAssignmentReadyCondition is set to True
            properties:
              conditions:
                description: |-
                  Conditions describes the latest observed state of the assignment. The primary condition is
                  VectorAssignmentReadyCondition, which becomes True once the deployer has finished processing the VectorAssignment.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: Spec is required once set
          rule: '!has(oldSelf.spec) || has(self.spec)'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
