{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: vectordeployments.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: VectorDeployment
    listKind: VectorDeploymentList
    plural: vectordeployments
    singular: vectordeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The deployment vector
      jsonPath: .spec.vector
      name: Vector
      type: string
    - description: Indicates if the vector is ready
      jsonPath: .status.conditions[?(@.type=="VectorReady")].status
      name: Vector-Ready
      type: string
    - description: The reason of the VectorReady condition
      jsonPath: .status.conditions[?(@.type=="VectorReady")].reason
      name: Reason
      type: string
    - description: The message of the VectorReady condition
      jsonPath: .status.conditions[?(@.type=="VectorReady")].message
      name: Message
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VectorDeployment is the Schema for the vectordeployments API.

          VectorDeployment represents the deployment of an immutable vector of artifacts into a specific environment or stage.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the VectorDeployment and
              is immutable after it has been set
            properties:
              vector:
                description: |-
                  Vector is a fully qualified URL pointing to an OCM ComponentVersion stored in an OCI registry. The referenced
                  component contains the deployment vector, which includes the complete list of artifacts and their versions.
                type: string
            required:
            - vector
            type: object
            x-kubernetes-validations:
            - message: VectorDeployment spec is immutable after it has been set
              rule: self == oldSelf
          status:
            description: |-
              VectorDeploymentStatus represents the observed state of a VectorDeployment as it progresses through the
              deployment lifecycle.

              The lifecycle consists of:
               1. Pulling the vector from the OCI registry and parsing its contents -> VectorDownloadedCondition
               2. Creating (or re-using) one ArtifactDeployment per artifact in the vector -> ArtifactDeploymentsCreatedCondition
               3. Waiting until all ArtifactDeployments have successfully deployed -> VectorDeployedCondition
               4. Creating all VectorAssignment resources associated with this vector -> VectorAssignmentsCreatedCondition
               5. Creating the VectorData CR with the resolved authored configuration + aggregated DeploymentResults; the
                  runtime-specific implementor then materialises it (e.g. as a ConfigMap on Kubernetes) -> VectorDataCreatedCondition
               6. Marking the vector as ready for use once VectorData reports its own Ready=True -> VectorReadyCondition
            properties:
              conditions:
                description: |-
                  Conditions represents the current set of status conditions for this vector
                  deployment. These conditions track progress through the lifecycle stages.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deploymentResults:
                additionalProperties:
                  description: ComponentDeploymentResults lists the deployment results
                    emitted by a single component.
                  items:
                    description: |-
                      DeploymentResult contains a single output produced by a deployer. These results are used to transport information
                      from the deployer to later phases of the vector lifecycle.
                    properties:
                      name:
                        description: Name identifies the result.
                        maxLength: 253
                        type: string
                      spec:
                        description: Spec contains deployer-specific structured data.
                          Its format is determined by the Type field.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      type:
                        description: Type describes the structure contained in Spec.
                          Each deployer may define multiple result types.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    - spec
                    - type
                    type: object
                  maxItems: 16
                  type: array
                description: |-
                  DeploymentResults exposes an aggregated view of the deployment results produced
                  by all underlying ArtifactDeployments. The map key is the artifact component name;
                  the value lists every result emitted by that ArtifactDeployment. Within a component's
                  list, results are unique by (name, type).
                maxProperties: 64
                type: object
                x-kubernetes-validations:
                - rule: self.all(k,self[k].all(a,self[k].exists_one(b,b.name==a.name&&b.type==a.type)))
              resolvedVectorOcm:
                description: |-
                  ResolvedVectorOcm contains the fully materialized content of the OCM ComponentVersion after it has been
                  downloaded and resolved from the OCI registry. Unlike the Spec.Vector value, which is only a reference (URL),
                  this field stores the actual resolved vector content as provided by OCM, including all artifacts and metadata.
                  It is not a reference but the inlined representation of the component version at reconciliation time.
                type: string
              resultingArtifactDeployments:
                additionalProperties:
                  description: LocalArtifactDeploymentReference holds a reference
                    to an ArtifactDeployment in the same namespace.
                  properties:
                    collisionCount:
                      description: |-
                        CollisionCount salts the ArtifactDeployment name hash to recover from a
                        (rare) hash collision with a different artifact. nil and 0 both mean "no
                        salt" and yield the original, unsalted name. Once bumped it is permanent
                        for this artifact slot. Mirrors Deployment.Status.CollisionCount.
                      format: int32
                      type: integer
                    name:
                      description: "Name\tis the name of the ArtifactDeployment. Required."
                      type: string
                  required:
                  - name
                  type: object
                description: |-
                  ResultingArtifactDeployments lists the ArtifactDeployment resources created (or re-used) for this vector. The
                  map key is the component name of the artifact as defined inside the vector. Keys remain stable across
                  reconciliations and re-creations.
                type: object
              resultingVectorAssignments:
                additionalProperties:
                  description: LocalVectorAssignmentReference holds a reference to
                    a VectorAssignment in the same namespace.
                  properties:
                    name:
                      description: "Name\tis the name of the VectorAssignment. Required."
                      type: string
                  required:
                  - name
                  type: object
                description: |-
                  ResultingVectorAssignments lists all VectorAssignment resources created for this vector. VectorAssignments are
                  not re-used like ArtifactDeployments, but instead each VectorDeployment results in a complete new set of
                  assignments.

                  The map key is the component name of the artifact. Keys are stable across reconcilations.
                type: object
              resultingVectorData:
                description: |-
                  ResultingVectorData records the name of the VectorData object created for this VectorDeployment. The VectorData
                  CR is the contract between the vector deployment controller (which resolves the OCM payload) and the runtime-specific implementor
                  (which materialises it on the target runtime). The field is empty until step 5 of the lifecycle has produced the
                  CR. Names are stable across reconciliations.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - name
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: Spec is required once set
          rule: '!has(oldSelf.spec) || has(self.spec)'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
