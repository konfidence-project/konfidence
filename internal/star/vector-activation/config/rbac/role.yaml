---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - vectoractivations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - vectoractivations/finalizers
  verbs:
  - update
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - vectoractivations/status
  verbs:
  - get
  - patch
  - update
