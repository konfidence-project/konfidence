name: PR

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  lint-test-build:
    name: PR
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/lint-test-build.yaml
    with:
      mode: pr
      snapshot-tag: ${{ github.sha }}

  secret-scanning-review:
    name: Secret Scanning Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: konfidence-project/.github/.github/workflows/secret-scanning-review.yaml@v4
    secrets: inherit

  codeql-status:
    name: CodeQL Status
    # CodeQL default setup does not analyze Dependabot-triggered PRs, so the
    # CodeQL check stays NEUTRAL and this job would time out.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      security-events: read
    steps:
      - name: Check CodeQL result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            # Select the newest PR run for this exact commit, not a push or an older rerun.
            run=$(gh api --paginate "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
              | jq -sr '[.[].workflow_runs[] | select(.path == ".github/workflows/codeql.yaml")]
                | sort_by(.created_at, .id, .run_attempt) | last
                | if . == null then "" else [(.run_started_at // .created_at), .run_attempt, .id, .status, (.conclusion // "pending")] | @tsv end')
            if [ -n "$run" ]; then
              IFS=$'\t' read -r run_started attempt id status conclusion <<< "$run"
              echo "Attempt $i: CodeQL workflow run $id (attempt $attempt): $status / $conclusion"
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  echo "CodeQL workflow did not succeed: $conclusion" >&2
                  exit 1
                fi

                # CodeQL can create a check before analysis and update it after upload.
                # Only its completion time proves freshness for this workflow attempt.
                check=$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=CodeQL&filter=latest&per_page=100" \
                  | jq -sr '[.[].check_runs[] | select(.name == "CodeQL" and .app.slug == "github-advanced-security")]
                    | sort_by(.started_at, .id) | last
                    | if . == null then "" else [(.completed_at // "pending"), .status, (.conclusion // "pending")] | @tsv end')
                if [ -n "$check" ]; then
                  IFS=$'\t' read -r completed check_status check_conclusion <<< "$check"
                  if [ "$check_status" = completed ] && [ "$completed" != pending ]; then
                    if [[ "$completed" < "$run_started" ]]; then
                      echo "Stale CodeQL check completed $completed before workflow attempt started $run_started; waiting"
                    else
                      echo "CodeQL security check: $check_status / $check_conclusion"
                      if [ "$check_conclusion" = success ]; then
                        exit 0
                      fi
                      echo "CodeQL security check did not pass: $check_conclusion" >&2
                      exit 1
                    fi
                  else
                    echo "Waiting for CodeQL security check to complete: $check_status"
                  fi
                fi
              fi
            else
              echo "Attempt $i: waiting for CodeQL PR workflow on $HEAD_SHA"
            fi
            sleep 30
          done
          echo "CodeQL workflow/check did not complete within 30 minutes" >&2
          exit 1

  ci-gate:
    name: CI Gate
    needs: [lint-test-build, secret-scanning-review, codeql-status]
    if: always()
    uses: konfidence-project/.github/.github/workflows/ci-gate.yaml@v4
    with:
      needs-json: ${{ toJson(needs) }}
