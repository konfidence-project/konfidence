name: Main

on:
  push:
    branches:
      - main
      - release-please-workflow # TODO: remove this branch before merging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-test-build:
    name: Main
    # Skip when the release PR with a chart version bump is merged into main — the release
    # pipeline handles building and publishing for those commits via the semver tag
    # that the release-please action pushes when the release PR is merged.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: konfidence-project/konfidence/.github/workflows/lint-test-build.yaml@main
    secrets: inherit
    with:
      mode: main
      snapshot-tag: ${{ github.sha }}

  release-please:
    name: Release PR
    needs: [ lint-test-build ]
    if: "needs.lint-test-build.result == 'success'"
    permissions:
      contents: write
      pull-requests: write
    uses: konfidence-project/.github/.github/workflows/release-please.yaml@release-please-workflow # TODO: remove this branch before merging # TEST
    secrets: inherit
