openapi: "3.0.3"

info:
  title: Konfidence API
  version: v1
  description: >
    HTTP gateway between CLI/UI clients and the Konfidence star cluster CRDs.

servers:
  - url: /api/v1
    description: Stage resources (versioned API)
  - url: /
    description: Auth and identity endpoints

paths:
  /api/login:
    get:
      operationId: loginStart
      summary: Initiate OIDC login
      description: >
        Redirects the browser to the IDP authorization endpoint, beginning the
        PKCE auth flow. On successful authentication the IDP redirects back to
        /api/auth/callback.
      tags: [auth]
      responses:
        "302":
          description: Redirect to IDP authorization endpoint.

  /api/auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback
      description: >
        Receives the authorization code from the IDP after successful login.
        Exchanges the code for tokens and establishes a session cookie.
      tags: [auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the application after successful authentication.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/logout:
    post:
      operationId: logout
      summary: Terminate the current session
      description: Clears the session cookie. Requires an active session.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session terminated successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/identity:
    get:
      operationId: getIdentity
      summary: Get the current user identity
      description: Returns identity claims for the authenticated session.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /stages:
    get:
      operationId: listStages
      summary: List all stages
      description: Returns all Stage resources visible to the API server.
      tags: [stages]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /stages/{name}:
    get:
      operationId: getStage
      summary: Get a stage by name
      tags: [stages]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/StageName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kden_session

  parameters:
    StageName:
      name: name
      in: path
      required: true
      description: Name of the Stage resource.
      schema:
        type: string

  schemas:
    StageCondition:
      type: object
      required: [type, status, reason, message, lastTransitionTime]
      properties:
        type:
          type: string
          description: Condition type (e.g. Ready, VectorDeployed).
        status:
          type: string
          enum: [True, False, Unknown]
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time

    StageResponse:
      type: object
      required: [name, namespace, vector, conditions, status]
      properties:
        name:       { type: string }
        namespace:  { type: string }
        vector:     { type: string }
        status:
          type: string
          enum: [Ready, Progressing, Degraded]
        conditions:
          type: array
          items: { $ref: "#/components/schemas/StageCondition" }

    StageListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StageResponse"

    IdentityResponse:
      type: object
      required: [subject, username]
      properties:
        subject:
          type: string
          description: Unique identifier from the IDP.
        username:
          type: string
        email:
          type: string
        groups:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
