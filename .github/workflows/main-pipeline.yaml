name: Main
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test-build:
    name: Main
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    uses: ./.github/workflows/lint-test-build.yaml
  publish:
    name: Publish images
    needs: [lint-test-build]
    permissions:
      contents: write
      packages: write
    uses: konfidence-project/.github/.github/workflows/goreleaser.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # protected release environment
    with:
      mode: main
      snapshot-tag: ${{ github.sha }}
  publish-dev-chart:
    name: Publish Dev Helm Chart
    needs: [publish]
    permissions:
      contents: read
      packages: write
    uses: konfidence-project/.github/.github/workflows/publish-helm-charts.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
    with:
      mode: dev
      charts: charts/konfidence
