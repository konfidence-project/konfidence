name: Kubebuilder CI
on: 
  push:
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:

  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/kubebuilder-kind-integration-test.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
    with:
      install-crds: true
      crds-version: v0.0.1
