{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: deploymenttargets.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: DeploymentTarget
    listKind: DeploymentTargetList
    plural: deploymenttargets
    singular: deploymenttarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Artifact type
      jsonPath: .spec.artifactType
      name: Artifact Type
      type: string
    - description: Reporting deployer
      jsonPath: .status.controller
      name: Controller
      type: string
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DeploymentTarget is the Schema for the deploymenttargets API. A DeploymentTarget
          configures a concrete deployment destination within a landscape for a specific
          artifact type. It is namespace-scoped and created in landscape namespaces.
          At most one DeploymentTarget for a given artifact type is allowed in a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeploymentTargetSpec defines the desired state of DeploymentTarget.
            properties:
              artifactType:
                description: |-
                  ArtifactType identifies which type of artifact should be deployed to the specified target. The ArtifactType is
                  selected by a deployer whose controllers are responsible for reconciling the DeploymentTarget resource. If there
                  is no deployer covering the given ArtifactType, the DeploymentTarget will never become ready. ArtifactType is
                  immutable because changing it may transfer ownership of the DeploymentTarget to a different controller.

                  Currently, Konfidence only supports one DeploymentTarget per ArtifactType in a landscape, so this field should
                  be unique across all DeploymentTargets in the same landscape namespace. If multiple DeploymentTargets with the
                  same ArtifactType exist in a single landscape namespace, deployers may fail their deployments, as they cannot
                  determine which DeploymentTarget takes precedence.
                type: string
                x-kubernetes-validations:
                - message: artifactType is immutable
                  rule: self == oldSelf
              parameters:
                description: |-
                  Parameters define how to connect to the target runtime described by this DeploymentTarget. It may point to
                  deployer-specific configuration containing connection details, credentials and further settings required to
                  connect to the target runtime. Their structure and interpretation are defined by the deployer that owns ArtifactType.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the group for the resource being referenced.
                      Defaults to the core API group ("") for Secret and ConfigMap.
                      For deployer-specific CRDs, set this to the appropriate API group.
                    type: string
                  kind:
                    description: Kind is the resource kind (e.g., "Secret", "ConfigMap",
                      or a deployer-specific kind).
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the referenced resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - artifactType
            type: object
          status:
            description: DeploymentTargetStatus defines the state observed by the
              responsible deployer.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controller:
                description: Controller identifies the deployer and release version
                  reporting this status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
