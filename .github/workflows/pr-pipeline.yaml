name: PR

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  lint-test-build:
    name: PR
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/lint-test-build.yaml
    with:
      mode: pr
      snapshot-tag: ${{ github.sha }}

  secret-scanning-review:
    name: Secret Scanning Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: konfidence-project/.github/.github/workflows/secret-scanning-review.yaml@v4
    secrets: inherit

  codeql-status:
    name: CodeQL Status
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Check CodeQL result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $ref: String!) {
              repository(owner: $owner, name: $repo) {
                ref(qualifiedName: $ref) {
                  target {
                    ... on Commit {
                      checkSuites(first: 10) {
                        nodes {
                          checkRuns(first: 20, filterBy: {checkName: "CodeQL"}) {
                            nodes { name conclusion }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' \
            -f owner='${{ github.repository_owner }}' \
            -f repo='${{ github.event.repository.name }}' \
            -f ref='${{ github.head_ref }}' \
            --jq '[.data.repository.ref.target.checkSuites.nodes[].checkRuns.nodes[] | select(.name == "CodeQL")] | first | .conclusion' \
            2>/dev/null || echo "null")
          echo "CodeQL conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != '"SUCCESS"' ] && [ "$CONCLUSION" != 'SUCCESS' ]; then
            echo "CodeQL has not passed (conclusion: $CONCLUSION)"
            exit 1
          fi

  ci-gate:
    name: CI Gate
    needs: [lint-test-build, secret-scanning-review, codeql-status]
    if: always()
    uses: konfidence-project/.github/.github/workflows/ci-gate.yaml@v4
    with:
      needs-json: ${{ toJson(needs) }}
