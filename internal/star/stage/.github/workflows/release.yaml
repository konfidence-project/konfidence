name: Release

on:
  push: 
    branches: [main]    

# Prevent duplicate runs: cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.head_ref }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/kubebuilder-kind-integration-test.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
    with:
      install-crds: true
      crds-version: v0.0.1

  build-and-release:
    name: Build and Release Container Image
    # Only run on main branch or pull requests
    uses: konfidence-project/.github/.github/workflows/kubebuilder-container-build-and-release.yaml@main

    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write