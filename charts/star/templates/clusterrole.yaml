{{- if .Values.controller.install -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
{{- include "star.labels" . | nindent 4 }}
  name: {{ include "star.fullname" . }}-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - galaxy.konfidence.cloud
  resources:
  - stagesyncs
  - stagesyncs/status
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - star.konfidence.cloud
  resources:
  - activationtaskexecutions
  - activationtaskregistrations
  - artifactdeployments
  - stages
  - stageversions
  - stageversionusages
  - taskexecutions
  - vectoractivations
  - vectorassignments
  - vectordeployments
  - vectormigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - star.konfidence.cloud
  resources:
  - activationtaskexecutions/status
  - activationtaskregistrations/status
  - artifactdeployments/status
  - stages/status
  - stageversions/status
  - stageversionusages/status
  - taskexecutions/status
  - vectoractivations/status
  - vectordeployments/status
  - vectormigrations/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - star.konfidence.cloud
  resources:
  - vectordata
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - star.konfidence.cloud
  resources:
  - vectordeployments/finalizers
  verbs:
  - update
{{- end }}
{{- if .Values.api.install }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "star.fullname" . }}-api
  labels:
    {{- include "star.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
- apiGroups: [""]
  resources: [namespaces, secrets, configmaps]
  verbs: [get, list, watch]
- apiGroups: [galaxy.konfidence.cloud]
  resources:
  - stageconfigurations
  - stageconfigurations/status
  - vectorpromotionconfigs
  - vectorpromotionconfigs/status
  - vectorpromotions
  - vectorpromotions/status
  - vectortemplates
  - vectortemplates/status
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [star.konfidence.cloud]
  resources:
  - activationtaskexecutions
  - activationtaskexecutions/status
  - activationtaskregistrations
  - activationtaskregistrations/status
  - artifactdeployments
  - artifactdeployments/status
  - stages
  - stages/status
  - stageversions
  - stageversions/status
  - stageversionusages
  - stageversionusages/status
  - taskexecutions
  - taskexecutions/status
  - vectoractivations
  - vectoractivations/status
  - vectorassignments
  - vectorassignments/status
  - vectordeployments
  - vectordeployments/status
  - vectormigrations
  - vectormigrations/status
  verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
