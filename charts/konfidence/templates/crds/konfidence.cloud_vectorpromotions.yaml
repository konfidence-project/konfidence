{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: vectorpromotions.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    kind: VectorPromotion
    listKind: VectorPromotionList
    plural: vectorpromotions
    singular: vectorpromotion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The referenced VectorPromotionConfig
      jsonPath: .spec.vectorPromotionConfigName
      name: Config
      type: string
    - description: The promotion source
      jsonPath: .spec.source.name
      name: Source
      type: string
    - description: The target Stage
      jsonPath: .spec.target.name
      name: Target
      type: string
    - description: Whether every gate is satisfied
      jsonPath: .status.conditions[?(@.type=="GatesSatisfied")].status
      name: Gates
      type: string
    - description: Promotion outcome
      jsonPath: .status.conditions[?(@.type=="Succeeded")].status
      name: Succeeded
      type: string
    - description: Reason of the outcome
      jsonPath: .status.conditions[?(@.type=="Succeeded")].reason
      name: Reason
      type: string
    - description: Execution start
      jsonPath: .status.startTime
      name: Started
      priority: 1
      type: date
    - description: The promoted vector version
      jsonPath: .spec.vector
      name: Vector
      priority: 1
      type: string
    - description: Age
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VectorPromotion triggers a one-time execution of a promotion
          flow defined by a VectorPromotionConfig.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VectorPromotionSpec defines the desired state of VectorPromotion.
            properties:
              gates:
                description: |-
                  Gates is an immutable snapshot of the config's gates at creation time.
                  The promotion does not execute until every gate has a `Satisfied` entry
                  in `status.gates`. An empty list promotes immediately. The field is
                  required: creators set an empty list rather than omitting it.
                items:
                  description: PromotionGate declares a gate a promotion must pass
                    before it executes.
                  properties:
                    type:
                      description: |-
                        Type identifies the gate as `<gate-name>.<owner-domain>`, for example
                        `explicit-approval.konfidence.cloud` or `e2e-tests.example.com`. The
                        first label names the gate, the remaining labels name the party that
                        owns the gate type and ships its writer. The promotion controller never
                        interprets the type; it only tracks whether the gate is satisfied.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?){2,}$
                      type: string
                  required:
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: gates are immutable after they have been set
                  rule: self == oldSelf
              sequence:
                description: |-
                  Sequence is a monotonic ordinal assigned by the creator (the config
                  reconciler, from the config's `status.sequence`). It is the sole
                  ordering between promotions of the same config; creation timestamps
                  only have second resolution and are never consulted.
                format: int64
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: sequence is immutable after it has been set
                  rule: self == oldSelf
              source:
                description: |-
                  Source is a snapshot of the config's source reference at creation time,
                  recorded so a promotion is self-describing.
                properties:
                  kind:
                    description: Kind is the kind of the source resource.
                    enum:
                    - VectorTemplate
                    - Stage
                    type: string
                  landscape:
                    description: |-
                      Landscape is the `metadata.name` of the `Landscape` in the config's
                      namespace (not its managed namespace) whose namespace hosts the
                      referenced `Stage`. Required for `Stage` references; must be omitted
                      for `VectorTemplate` references, which are resolved in the config's
                      namespace.
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the source resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: source is immutable after it has been set
                  rule: self == oldSelf
                - message: landscape is required for Stage references and must be
                    omitted for VectorTemplate references
                  rule: (self.kind == 'Stage') == has(self.landscape)
              target:
                description: |-
                  Target is a snapshot of the config's target reference at creation time.
                  Execution resolves and writes this target: approving a promotion approves
                  exactly this destination, regardless of later config edits.
                properties:
                  kind:
                    description: Kind is the kind of the target resource. Only `Stage`
                      is supported.
                    enum:
                    - Stage
                    type: string
                  landscape:
                    description: |-
                      Landscape is the `metadata.name` of the `Landscape` in the config's
                      namespace (not its managed namespace) whose namespace hosts the target
                      `Stage`.
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target `Stage`.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - landscape
                - name
                type: object
                x-kubernetes-validations:
                - message: target is immutable after it has been set
                  rule: self == oldSelf
              ttlAfterFinished:
                description: |-
                  TTLAfterFinished defines how long the VectorPromotion should be kept after completion.
                  Once the TTL expires after the promotion finished (`status.completionTime`),
                  the resource is eligible for automatic deletion. If no TTL is set, no deletion happens.
                type: string
              vector:
                description: |-
                  Vector is the concrete OCM component version reference
                  (`<registry>//<component>:<version>`) pinned when the promotion was created.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: vector is immutable after it has been set
                  rule: self == oldSelf
              vectorPromotionConfigName:
                description: VectorPromotionConfigName is the name of the VectorPromotionConfig
                  that defines the promotion flow to execute.
                minLength: 1
                type: string
            required:
            - gates
            - sequence
            - source
            - target
            - vector
            - vectorPromotionConfigName
            type: object
          status:
            description: VectorPromotionStatus defines the observed state of VectorPromotion.
            properties:
              completionTime:
                description: CompletionTime is when the promotion finished (Succeeded
                  True or False).
                format: date-time
                type: string
              conditions:
                description: Conditions report GatesSatisfied, TargetResolved and
                  Succeeded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gates:
                description: |-
                  Gates reports the state and provenance of each declared gate, keyed by
                  gate type. Entries are seeded `Pending` by the promotion controller and
                  set by the gate's writer (a gate controller or the konfidence API)
                  through `pkg/promotiongate`. A missing entry counts as `Pending`.
                items:
                  description: |-
                    PromotionGateStatus reports the state of one declared gate together with
                    its provenance: who set it, when, and why.
                  properties:
                    message:
                      description: |-
                        Message is a human-readable description of the latest state change,
                        e.g. what is misconfigured when State is `Error`.
                      maxLength: 32768
                      type: string
                    reason:
                      description: Reason is a machine-readable CamelCase reason for
                        the latest state change.
                      maxLength: 1024
                      type: string
                    setAt:
                      description: SetAt is the time the gate state was last set.
                      format: date-time
                      type: string
                    setBy:
                      description: |-
                        SetBy is the entity that last set the gate state: a controller name or,
                        for human actions, the authenticated subject. The value is advisory and
                        not a security boundary.
                      type: string
                    state:
                      description: State is the current state of the gate.
                      enum:
                      - Pending
                      - Satisfied
                      - Error
                      type: string
                    type:
                      description: Type is the gate type this entry reports on.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - state
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              promotedStageRef:
                description: |-
                  PromotedStageRef records the Stage this promotion actually wrote its
                  vector to, so the promotion is self-describing even after the config
                  changed or was deleted.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the group for the resource being referenced.
                      If APIGroup is not specified, the specified Kind must be in the core API group.
                      For any other third-party types, APIGroup is required.
                    type: string
                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of resource being referenced
                      Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                      (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                    type: string
                required:
                - kind
                - name
                type: object
              startTime:
                description: |-
                  StartTime is when execution started, i.e. the promotion began writing
                  its vector to the target Stage. Set at most once.
                format: date-time
                type: string
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.vectorPromotionConfigName
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
