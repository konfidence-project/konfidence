name: PR

on:
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: PR
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/lint-test-build.yaml
    secrets: inherit
    with:
      mode: pr
      snapshot-tag: ${{ github.sha }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint-test-build]
    if: always()
    steps:
      - name: Fail if any job failed or cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          CI_FAILED=$(echo "$NEEDS_JSON" | jq -r '
          to_entries[]
          | select(.value.result == "failure" or .value.result == "cancelled")
          | .key
          ')

          if [ -n "$CI_FAILED" ]; then
            echo "Failed jobs:"
            echo "$CI_FAILED"
            exit 1
          fi

          echo "All required jobs passed or were skipped"
