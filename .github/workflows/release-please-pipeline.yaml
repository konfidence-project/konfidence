name: Release PR
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  # Keep ordinary pushes/PR closures from replacing a queued release.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.label || 'main' }}
  cancel-in-progress: false
jobs:
  update-release-pr:
    name: Update Release PR
    if: github.event_name == 'push'
    uses: konfidence-project/.github/.github/workflows/release-pr.yaml@9891c53d7855f442c4e96a02b889b7cf2a8b9f79 # candidate v5; re-pin after release
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
  release-please:
    name: Create Release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    uses: konfidence-project/.github/.github/workflows/release-please.yaml@8e03fc5ecfd62cbec97f3462401ee3232277d55b # candidate v5; re-pin after release
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
  release:
    name: Release
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/lint-test-build.yaml
  publish:
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: konfidence-project/.github/.github/workflows/goreleaser.yaml@8e03fc5ecfd62cbec97f3462401ee3232277d55b # candidate v5; re-pin after release
    with:
      mode: release
      snapshot-tag: ${{ needs.release-please.outputs.tag_name }}
  publish-helm-charts:
    name: Publish Helm Charts
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: konfidence-project/.github/.github/workflows/publish-helm-charts.yaml@8e03fc5ecfd62cbec97f3462401ee3232277d55b # candidate v5; re-pin after release
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      charts: charts/konfidence
  publish-release:
    name: Publish Release
    needs: [release-please, publish, publish-helm-charts]
    if: needs.release-please.outputs.release_created == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
