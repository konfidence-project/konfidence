{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: deploymentclasses.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: DeploymentClass
    listKind: DeploymentClassList
    plural: deploymentclasses
    singular: deploymentclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Deployment class type
      jsonPath: .spec.type
      name: Type
      type: string
    - description: Controller name
      jsonPath: .spec.controller
      name: Controller
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DeploymentClass is the Schema for the deploymentclasses API. A DeploymentClass
          declares a deployment capability provided by a deployer (controller). It is a
          cluster-scoped resource installed by deployers to advertise their capabilities.
          Artifacts reference the spec.type field to select which deployer handles their deployment.
          The type must be unique across all DeploymentClasses in the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeploymentClassSpec defines the desired state of DeploymentClass.
            properties:
              controller:
                description: |-
                  Controller is the name of the controller that implements this deployment class.
                  This identifies which operator/controller is responsible for reconciling
                  resources of this deployment class (e.g., "kubernetes-landscape-orchestrator").
                maxLength: 253
                minLength: 1
                type: string
              type:
                description: |-
                  Type is the unique deployment class type identifier (e.g., "konfidence.cloud/helm").
                  This is what artifacts reference in their manifest.type field to select which
                  deployer handles their deployment. The type must be unique across all DeploymentClasses
                  in the cluster and follows the pattern "<vendor-domain>/<class-name>".
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - controller
            - type
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
{{- end }}
