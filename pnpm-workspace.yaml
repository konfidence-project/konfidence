packages:
  - apps/konfidence-cli-pages
  - apps/konfidence-design-preview
  - apps/konfidence-mock-api
  - apps/konfidence-ui
  - packages/*
catalog:
  playwright: &playwright-version 1.62.1
  "@playwright/test": 1.63.0
  "@vitest/browser-playwright": 5.0.3
# image-size <=2.0.2 (build-time transitive of less) has no patched release;
# drop these ignores once upstream ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
overrides:
  cookie@<0.7.0: ^0.7.0
  js-yaml@<4.3.1: ^4.3.1
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - brace-expansion@2.1.5 || 2.1.6 || 2.1.7
  - source-map-js@1.2.2
  - postcss-selector-parser@7.1.6
  - tinypool@2.1.1 || 2.1.2
