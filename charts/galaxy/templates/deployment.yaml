{{- if .Values.controller.install -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "galaxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "galaxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "galaxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "galaxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "galaxy.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --controllers={{ .Values.controller.controllers }}
            - --leader-elect={{ .Values.controller.leaderElection }}
            - --lease-id={{ .Values.controller.leaseId }}
            - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            {{- if .Values.controller.kcpEndpointSliceName }}
            - --kcp-endpoint-slice-name={{ .Values.controller.kcpEndpointSliceName }}
            {{- end }}
            {{- if .Values.controller.kubernetesHost }}
            - --kubernetes-host={{ .Values.controller.kubernetesHost }}
            {{- end }}
            {{- if gt (int .Values.controller.kubernetesPort) 0 }}
            - --kubernetes-port={{ .Values.controller.kubernetesPort }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.env .Values.controller.kubeconfig.secretName }}
          env:
            {{- if .Values.controller.kubeconfig.secretName }}
            - name: KUBECONFIG
              value: {{ printf "%s/%s" .Values.controller.kubeconfig.mountPath .Values.controller.kubeconfig.secretKey | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.controller.kubeconfig.secretName }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.controller.kubeconfig.secretName }}
            - name: kcp-kubeconfig
              mountPath: {{ .Values.controller.kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
          ports:
            - name: health
              containerPort: {{ include "galaxy.bindAddressPort" .Values.controller.healthProbeBindAddress }}
              protocol: TCP
            {{- if ne (.Values.controller.metricsBindAddress | toString) "0" }}
            - name: metrics
              containerPort: {{ include "galaxy.bindAddressPort" .Values.controller.metricsBindAddress }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- if or .Values.volumes .Values.controller.kubeconfig.secretName }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.controller.kubeconfig.secretName }}
        - name: kcp-kubeconfig
          secret:
            secretName: {{ .Values.controller.kubeconfig.secretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
