{{- if and .Values.api.enabled .Values.api.migrations.enabled (eq .Values.api.session.storageType "db-pg") -}}
{{- $ref := .Values.api.database.connectionSecretRef }}
{{- $override := .Values.api.migrations.connectionSecretRef }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "konfidence.fullname" . }}-api-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konfidence.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.api.migrations.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "konfidence.baseSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-migrate
    spec:
      restartPolicy: OnFailure
      # Pre-install hooks run before the chart's ServiceAccount exists, and the
      # migration never talks to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args:
            - migrate
            - up
            - --log-level={{ .Values.api.server.logLevel }}
          env:
            - name: API_DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.database.connectionSecretRef.name is required when api.session.storageType is db-pg" ($override.name | default $ref.name) }}
                  key: {{ required "api.database.connectionSecretRef.key is required" ($override.key | default $ref.key) }}
          resources:
            {{- toYaml .Values.api.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
