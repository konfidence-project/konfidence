name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@v4
    secrets: inherit

  test-star:
    name: Test Star
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-star

  test-galaxy:
    name: Test Galaxy
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-galaxy

  test-pkg:
    name: Test Pkg
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-pkg

  build:
    name: Build
    runs-on: konfidence-large
    needs: [test-star, test-galaxy, test-pkg] # TODO: add lint dependency back when linting is fixed
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Generate manifests
        run: make api

      - name: Verify no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make api' and commit the result."
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Bake (build only)
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: false

  apply-api-resource-schemas:
    name: Apply API Resource Schemas
    runs-on: konfidence-large
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout konfidence
        uses: actions/checkout@v6

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Install kubectl-kcp
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL https://api.github.com/repos/kcp-dev/kcp/releases/latest | jq -r .tag_name)
          echo "Installing kubectl-kcp ${LATEST}"
          curl -fsSL -o /tmp/kcp-plugins.tar.gz \
            "https://github.com/kcp-dev/kcp/releases/download/${LATEST}/kubectl-kcp-plugin_${LATEST#v}_linux_amd64.tar.gz"
          mkdir -p /tmp/kcp-plugins
          tar -xzf /tmp/kcp-plugins.tar.gz -C /tmp/kcp-plugins
          sudo mv /tmp/kcp-plugins/bin/kubectl-kcp /usr/local/bin/kubectl-kcp
          sudo chmod +x /usr/local/bin/kubectl-kcp
          kubectl-kcp --help >/dev/null

      - name: Checkout gitops-showroom
        uses: actions/checkout@v6
        with:
          repository: konfidence-project/gitops-showroom
          token: ${{ secrets.GH_TOKEN }}
          path: gitops-showroom

      - name: Generate apiresourceschemas.yaml
        run: |
          echo 'AUTO-GENERATED BY KONFIDENCE PIPELINE - DO NOT EDIT' \
            > gitops-showroom/clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml
          helm template galaxy charts/galaxy/ --set controller.install=false \
            | kubectl kcp crd snapshot -f - --prefix v1a -o yaml \
            >> gitops-showroom/clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml

      - name: Commit and push if changed
        working-directory: gitops-showroom
        run: |
          set -euo pipefail
          if git diff --quiet -- clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml; then
            echo "apiresourceschemas.yaml unchanged, nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml
          git commit -m "chore: update API resource schemas from konfidence@${GITHUB_SHA::7}"
          git push
        env:
          GITHUB_SHA: ${{ github.sha }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-star
      - test-galaxy
      - test-pkg
      - build
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Fail if any job failed or cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          CI_FAILED=$(echo "$NEEDS_JSON" | jq -r '
          to_entries[]
          | select(.value.result == "failure" or .value.result == "cancelled")
          | .key
          ')

          if [ -n "$CI_FAILED" ]; then
          echo "Failed jobs:"
          echo "$CI_FAILED"
          exit 1
          fi

          echo "All required jobs passed or were skipped"
