name: PR

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  lint-test-build:
    name: PR
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/lint-test-build.yaml
    with:
      mode: pr
      snapshot-tag: ${{ github.sha }}

  secret-scanning-review:
    name: Secret Scanning Review
    permissions:
      contents: read
    uses: konfidence-project/.github/.github/workflows/secret-scanning-review.yaml@v4
    secrets: inherit

  ci-gate:
    name: CI Gate
    needs: [lint-test-build, secret-scanning-review]
    if: always()
    uses: konfidence-project/.github/.github/workflows/ci-gate.yaml@v4
    with:
      needs-json: ${{ toJson(needs) }}
