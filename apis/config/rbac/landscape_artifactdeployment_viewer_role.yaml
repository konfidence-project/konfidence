# permissions for end users to view artifactdeployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crds
    app.kubernetes.io/managed-by: kustomize
  name: landscape-artifactdeployment-viewer-role
rules:
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - artifactdeployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - artifactdeployments/status
  verbs:
  - get
