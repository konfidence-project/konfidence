{{- if and (or .Values.controller.install .Values.api.enabled) .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "konfidence.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konfidence.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
