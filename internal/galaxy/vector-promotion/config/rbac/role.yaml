---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galaxy-vector-promotion-manager
rules:
- apiGroups:
  - galaxy.konfidence.cloud
  resources:
  - vectorpromotionconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - galaxy.konfidence.cloud
  resources:
  - vectorpromotionconfigs/status
  - vectorpromotions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - galaxy.konfidence.cloud
  resources:
  - vectorpromotions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
