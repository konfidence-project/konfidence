name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  apply-api-resource-schemas:
    name: Apply API Resource Schemas
    runs-on: konfidence-large
    steps:
      - name: Checkout konfidence
        uses: actions/checkout@v6

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Install kubectl-kcp
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL https://api.github.com/repos/kcp-dev/kcp/releases/latest | jq -r .tag_name)
          echo "Installing kubectl-kcp ${LATEST}"
          curl -fsSL -o /tmp/kcp-plugins.tar.gz \
            "https://github.com/kcp-dev/kcp/releases/download/${LATEST}/kubectl-kcp-plugin_${LATEST#v}_linux_amd64.tar.gz"
          mkdir -p /tmp/kcp-plugins
          tar -xzf /tmp/kcp-plugins.tar.gz -C /tmp/kcp-plugins
          sudo mv /tmp/kcp-plugins/bin/kubectl-kcp /usr/local/bin/kubectl-kcp
          sudo chmod +x /usr/local/bin/kubectl-kcp
          kubectl-kcp --help >/dev/null

      - name: Checkout gitops-showroom
        uses: actions/checkout@v6
        with:
          repository: konfidence-project/gitops-showroom
          token: ${{ secrets.GITOPS_SHOWROOM_TOKEN }}
          path: gitops-showroom

      - name: Generate apiresourceschemas.yaml
        run: |
          helm template galaxy charts/galaxy/ --set controller.install=false \
            | kubectl kcp crd snapshot -f - --prefix v1a -o yaml \
            > gitops-showroom/clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml

      - name: Commit and push if changed
        working-directory: gitops-showroom
        run: |
          set -euo pipefail
          if git diff --quiet -- clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml; then
            echo "apiresourceschemas.yaml unchanged, nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clusters/gke-kden-showroom-gcp/ws-kcp-konfidence-provider/apiresourceschemas.yaml
          git commit -m "chore: update API resource schemas from konfidence@${GITHUB_SHA::7}"
          git push
        env:
          GITHUB_SHA: ${{ github.sha }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - apply-api-resource-schemas
    if: always()
    steps:
      - name: Fail if any job failed or cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          CI_FAILED=$(echo "$NEEDS_JSON" | jq -r '
          to_entries[]
          | select(.value.result == "failure" or .value.result == "cancelled")
          | .key
          ')

          if [ -n "$CI_FAILED" ]; then
          echo "Failed jobs:"
          echo "$CI_FAILED"
          exit 1
          fi

          echo "All required jobs passed or were skipped"
