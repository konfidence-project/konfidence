<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the "system" theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)konfidence_theme=([^;]*)/);
          if (match && decodeURIComponent(match[1]) === "system") {
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = dark ? "konfidence-dark" : "konfidence";
          }
        } catch (error) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
