apiVersion: apps/v1
kind: Deployment
metadata:
  name: landscape-stage-controller
  labels:
    app.kubernetes.io/name: landscape-stage-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: landscape-stage-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: landscape-stage-controller
        app.kubernetes.io/managed-by: kustomize
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --gcp-sync-kubeconfig=/etc/kcp-kubeconfig/kubeconfig
        image: konfidence-project/landscape-stage-controller:latest
        imagePullPolicy: Always
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
          - name: kcp-kubeconfig
            mountPath: /etc/kcp-kubeconfig
            readOnly: true
      volumes:
        - name: kcp-kubeconfig
          secret:
            secretName: kcp-kubeconfig
      serviceAccountName:  landscape-stage-controller
      terminationGracePeriodSeconds: 10
