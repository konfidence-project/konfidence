{{- if and .Values.controller.install (ne (.Values.controller.metricsBindAddress | toString) "0") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "konfidence.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konfidence.operatorLabels" . | nindent 4 }}
    konfidence.cloud/service: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ include "konfidence.bindAddressPort" .Values.controller.metricsBindAddress }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "konfidence.operatorSelectorLabels" . | nindent 4 }}
{{- end }}
