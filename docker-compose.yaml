services:
  dex:
    image: ghcr.io/dexidp/dex:v2.43.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    configs:
      - source: dex_config
        target: /etc/dex/config.yaml

configs:
  dex_config:
    content: |
      issuer: http://localhost:5556/oidc
      storage:
        type: memory
      web:
        http: 0.0.0.0:5556
      oauth2:
        skipApprovalScreen: true
      staticClients:
        - id: konfidence
          name: Konfidence Local
          secret: konfidence-local-secret
          redirectURIs:
            - http://localhost:8090/api/v1/auth/callback
      enablePasswordDB: true
      staticPasswords:
        # Local login: developer@konfidence.local / password
        - email: developer@konfidence.local
          hash: "$$2y$$10$$r9kGal5HO3cv3PH0AHSpde3qqnlH09hQvdiUIikAlHyvlaSf/eDJi"
          username: Developer
          userID: 97d0c01a-962f-4d20-a84f-6a0cdcc645d4
