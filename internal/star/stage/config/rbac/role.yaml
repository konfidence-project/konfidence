  - stageversions
  - vectoractivations
  - vectordeployments
  - vectormigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - stageversions/status
  - vectoractivations/status
  - vectordeployments/status
  - vectormigrations/status
  verbs:
  - get
