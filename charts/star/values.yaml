# CRD lifecycle toggles.
# installCRDs:    apply CRDs alongside the controller. Disable for GitOps
#                 setups that manage CRDs out-of-band.
# keepCRDs:       on `helm uninstall`, retain CRDs to protect existing CRs.
#                 Strongly recommended.
installCRDs: true
keepCRDs: true

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/konfidence-project/star-operator
  # tag defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Forwarded as flags to the operator binary (cmd/star).
controller:
  # Comma-separated list of sub-controllers, or "*" for all.
  controllers: "*"
  leaderElection: true
  leaseId: "star-operator.konfidence.cloud"
  healthProbeBindAddress: ":8081"
  metricsBindAddress: ":8080"
  # Set this when the galaxysync controller is enabled — it uses this
  # namespace to scope its bookkeeping.
  controllerNamespace: ""

env: []
extraArgs: []

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
