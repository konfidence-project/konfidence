{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: vectorpromotions.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    kind: VectorPromotion
    listKind: VectorPromotionList
    plural: vectorpromotions
    singular: vectorpromotion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The referenced VectorPromotionConfig
      jsonPath: .spec.vectorPromotionConfigRef
      name: Config
      type: string
    - description: The promoted vector version
      jsonPath: .spec.vector
      name: Vector
      type: string
    - description: Promotion state
      jsonPath: .status.state
      name: State
      type: string
    - description: Age
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VectorPromotion triggers a one-time execution of a promotion
          flow defined by a VectorPromotionConfig.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VectorPromotionSpec defines the desired state of VectorPromotion.
            properties:
              requireApproval:
                default: false
                description: |-
                  RequireApproval is true when the promotion must be approved before
                  execution; false means the promotion is approved automatically. It is
                  independent of the source kind: the config controller defaults it to
                  true for `Stage` sources, but any combination is valid.
                type: boolean
                x-kubernetes-validations:
                - message: requireApproval is immutable after it has been set
                  rule: self == oldSelf
              ttlAfterFinished:
                description: |-
                  TTLAfterFinished defines how long the VectorPromotion should be kept after completion.
                  Once the TTL expires after the promotion reaches a terminal state (Completed or Failed),
                  the resource is eligible for automatic deletion. If no TTL is set, no deletion happens.
                type: string
              vector:
                description: |-
                  Vector is the concrete OCM component version reference
                  (`<registry>//<component>:<version>`) pinned when the promotion was created.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: vector is immutable after it has been set
                  rule: self == oldSelf
              vectorPromotionConfigRef:
                description: VectorPromotionConfigRef is the name of the VectorPromotionConfig
                  that defines the promotion flow to execute.
                minLength: 1
                type: string
            required:
            - vector
            - vectorPromotionConfigRef
            type: object
          status:
            description: VectorPromotionStatus defines the observed state of VectorPromotion.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              state:
                description: |-
                  State summarizes Conditions for display. Conditions are the source of
                  truth; State is recomputed whenever conditions are written. `Superseded`
                  is a locked terminal state: a superseded promotion can never be
                  approved or executed afterwards, only its successor can.
                enum:
                - Waiting
                - Ready
                - InProgress
                - Succeeded
                - Failed
                - Superseded
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
