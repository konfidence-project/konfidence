---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landscape-gcp-sync-manager
rules:
- apiGroups:
  - global.konfidence.cloud
  resources:
  - stagesyncs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - global.konfidence.cloud
  resources:
  - stagesyncs/status
  verbs:
  - get
  - patch
  - update
