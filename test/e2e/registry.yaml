apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-registry
  namespace: konfidence-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-registry}
  template:
    metadata:
      labels: {app: e2e-registry}
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-registry
  namespace: konfidence-system
spec:
  selector: {app: e2e-registry}
  ports: [{port: 5000, targetPort: 5000}]
