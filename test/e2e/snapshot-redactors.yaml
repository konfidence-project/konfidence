apiVersion: troubleshoot.sh/v1beta2
kind: Redactor
metadata:
  name: konfidence-e2e
spec:
  redactors:
    # Token literals are masked in place, so JSON stays valid everywhere.
    - name: credential tokens
      removals:
        regex:
          - redactor: '(?P<mask>gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)'
    # key=value / key: value only in text logs; never applied to JSON resources.
    - name: credential assignments in logs
      fileSelector:
        files:
          - host-collectors/**
          - cluster-resources/pods/logs/**
      removals:
        regex:
          - redactor: >-
              (?i)([a-z0-9_]*(?:password|token|secret|api_key)[a-z0-9_]*\s*[:=]\s*)(?P<mask>[^\s"',]+)
