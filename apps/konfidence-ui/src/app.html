<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="icon" href="%sveltekit.assets%/logos/icon.svg" />
    <link rel="stylesheet" href="%sveltekit.assets%/design-system/tokens.css" />
    <link rel="stylesheet" href="%sveltekit.assets%/design-system/components.css" />
    <style>
      /* Paint the canvas colour before any component styles load so the
         initial empty shell shares the app background and never flashes
         white before hydration. */
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--surface-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
