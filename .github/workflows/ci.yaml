name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: konfidence-large
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Generate manifests
        run: make api

      - name: Verify no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make api' and commit the result."
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Bake
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: true
