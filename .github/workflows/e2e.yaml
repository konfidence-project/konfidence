name: E2E

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to test
        type: choice
        required: true
        default: PR + main
        options:
          - PR + main
          - Latest releases
      konfidence_ref:
        description: Konfidence full commit SHA; empty uses workflow branch (PR + main only)
        type: string
        required: false
      klo_ref:
        description: KLO/VDS full commit SHA; empty uses latest successful main (PR + main only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  example-app:
    name: Example app
    # Fork PR tokens cannot publish packages.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout selected Konfidence core
        id: core
        if: github.event_name == 'workflow_dispatch' && inputs.stack != 'Latest releases' && inputs.konfidence_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.konfidence_ref }}
          path: .tmp/konfidence-core
          persist-credentials: false

      - uses: cashapp/activate-hermit@v1

      - name: Install snapshot CLI
        id: snapshot-cli
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot-tools"
          cd "$RUNNER_TEMP/snapshot-tools"
          url=https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.3
          curl -fsSL "$url/support-bundle_linux_amd64.tar.gz" -o support-bundle_linux_amd64.tar.gz
          curl -fsSL "$url/troubleshoot_0.134.3_checksums.txt" -o checksums.txt
          grep 'support-bundle_linux_amd64.tar.gz$' checksums.txt | sha256sum --check
          tar -xzf support-bundle_linux_amd64.tar.gz support-bundle
          echo "$RUNNER_TEMP/snapshot-tools" >> "$GITHUB_PATH"

      - name: Create cluster
        id: cluster
        run: |
          case "$E2E_STACK" in
            'Latest releases') make e2e-up-release ;;
            ''|'PR + main') make e2e-up ;;
            *) echo "Unknown E2E stack: $E2E_STACK" >&2; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_STACK: ${{ inputs.stack }}
          E2E_CORE_DIR: ${{ steps.core.outcome == 'success' && '.tmp/konfidence-core' || '.' }}
          KLO_REF: ${{ inputs.klo_ref }}

      - name: Test
        run: |
          mkdir -p e2e-report
          make test-e2e CHAINSAW_ARGS="--skip-delete --report-format JUNIT-STEP --report-path e2e-report"
        env:
          REGISTRY: ghcr.io/${{ github.repository }}/e2e
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}

      - name: Capture failure snapshot
        if: failure() && steps.snapshot-cli.outcome == 'success'
        continue-on-error: true
        run: make e2e-snapshot

      - name: Summary
        if: always() && hashFiles('e2e-report/*.xml') != ''
        uses: test-summary/action@v2
        with:
          paths: e2e-report/*.xml
          show: all

      - name: Upload failure snapshot
        if: always() && hashFiles('.tmp/e2e-snapshot/*.tar.gz') != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-snapshot-${{ github.run_attempt }}
          path: .tmp/e2e-snapshot/*.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Delete kind cluster
        if: always() && steps.cluster.outcome != '' && steps.cluster.outcome != 'skipped'
        run: make e2e-down

      - name: Delete stale e2e package versions
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 2
          script: |
            const org = context.repo.owner;
            const base = `${context.repo.repo.toLowerCase()}/e2e/component-descriptors/github.com/konfidence-project`;
            const HOUR = 60 * 60 * 1000;
            const packages = [
              // Run-unique tags; anything older than the job timeout is unreferenced.
              {name: 'e2e-test/vector', keep: 1, maxAgeMs: 2 * HOUR},
              // Upstream versions shared by concurrent runs; only prune superseded ones.
              {name: 'example-app/candidates', keep: 5},
              {name: 'example-app/interviews', keep: 5},
            ];
            for (const pkg of packages) {
              const package_name = `${base}/${pkg.name}`;
              const params = {org, package_type: 'container', package_name};
              let versions;
              try {
                versions = await github.paginate(
                  'GET /orgs/{org}/packages/{package_type}/{package_name}/versions', {...params, per_page: 100});
              } catch (error) {
                if (error.status !== 404)
                  core.warning(`cannot list ${package_name}: HTTP ${error.status} ${error.response?.data?.message ?? ''}`);
                continue;
              }
              versions.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              const stale = versions.slice(pkg.keep).filter(v =>
                pkg.maxAgeMs === undefined || Date.now() - Date.parse(v.created_at) > pkg.maxAgeMs);
              for (const v of stale) {
                try {
                  await github.request(
                    'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                    {...params, package_version_id: v.id});
                  core.info(`deleted ${package_name}@${v.metadata?.container?.tags?.join(',') || v.name}`);
                } catch (error) {
                  if (error.status !== 404)
                    core.warning(`cannot delete ${package_name} version ${v.id}: HTTP ${error.status} ${error.response?.data?.message ?? ''}`);
                }
              }
            }
