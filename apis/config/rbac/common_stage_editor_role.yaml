# permissions for end users to edit stages.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crds
    app.kubernetes.io/managed-by: kustomize
  name: common-stage-editor-role
rules:
- apiGroups:
  - common.konfidence.tools.sap
  resources:
  - stages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - common.konfidence.tools.sap
  resources:
  - stages/status
  verbs:
  - get
