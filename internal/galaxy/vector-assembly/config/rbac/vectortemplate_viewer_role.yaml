# This rule is not used by the project hackathon-vector-assembly itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to global.konfidence.cloud resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hackathon-vector-assembly
    app.kubernetes.io/managed-by: kustomize
  name: vectortemplate-viewer-role
rules:
- apiGroups:
  - global.konfidence.cloud
  resources:
  - vectortemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - global.konfidence.cloud
  resources:
  - vectortemplates/status
  verbs:
  - get
