{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konfidence.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konfidence.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "konfidence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "konfidence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "konfidence.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args:
            - --addr={{ .Values.api.server.addr }}
            - --log-level={{ .Values.api.server.logLevel }}
            - --read-timeout={{ .Values.api.server.readTimeout }}
            - --write-timeout={{ .Values.api.server.writeTimeout }}
            - --shutdown-timeout={{ .Values.api.server.shutdownTimeout }}
            - --oidc-enabled={{ .Values.api.oidc.enabled }}
            {{- if .Values.api.oidc.enabled }}
            - --oidc-issuer-url={{ required "api.oidc.issuerURL is required" .Values.api.oidc.issuerURL }}
            - --oidc-client-id={{ required "api.oidc.clientId is required" .Values.api.oidc.clientId }}
            - --oidc-scopes={{ .Values.api.oidc.scopes }}
            - --oidc-redirect-url={{ required "api.oidc.redirectURL is required" .Values.api.oidc.redirectURL }}
            {{- with .Values.api.oidc.allowReturnUrls }}
            - --oidc-allow-return-urls={{ join "," . | quote }}
            {{- end }}
            - --oidc-token-url={{ .Values.api.oidc.tokenURL }}
            - --oidc-authorization-url={{ .Values.api.oidc.authorizationURL }}
            - --oidc-device-auth-url={{ .Values.api.oidc.deviceAuthURL }}
            - --oidc-user-info-url={{ .Values.api.oidc.userInfoURL }}
            - --oidc-jwks-url={{ .Values.api.oidc.jwksURL }}
            - --oidc-pkce-enabled={{ .Values.api.oidc.pkceEnabled }}
            - --oidc-state-expiration={{ .Values.api.oidc.stateExpiration }}
            {{- end }}
            - --session-cookie-name={{ .Values.api.session.cookie.name }}
            - --session-cookie-http-only={{ .Values.api.session.cookie.httpOnly }}
            - --session-cookie-secure={{ .Values.api.session.cookie.secure }}
            - --session-cookie-same-site={{ .Values.api.session.cookie.sameSite }}
            - --session-expiration={{ .Values.api.session.expiration }}
            - --session-cleanup-interval={{ .Values.api.session.cleanupInterval }}
            - --session-storage-type={{ .Values.api.session.storageType }}
            - --db-max-conns={{ .Values.api.database.maxConns }}
            - --db-min-conns={{ .Values.api.database.minConns }}
            - --db-max-conn-lifetime={{ .Values.api.database.maxConnLifetime }}
            - --db-max-conn-idle-time={{ .Values.api.database.maxConnIdleTime }}
            {{- with .Values.api.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.api.oidc.enabled .Values.api.env }}
          env:
            {{- if .Values.api.oidc.enabled }}
            - name: API_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.oidc.clientSecretRef.name is required" .Values.api.oidc.clientSecretRef.name }}
                  key: {{ required "api.oidc.clientSecretRef.key is required" .Values.api.oidc.clientSecretRef.key }}
            {{- end }}
            {{- with .Values.api.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.api.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "konfidence.bindAddressPort" .Values.api.server.addr }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.api.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
