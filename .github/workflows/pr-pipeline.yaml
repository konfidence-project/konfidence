name: PR
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  lint-test-build:
    name: PR
    uses: ./.github/workflows/lint-test-build.yaml

  secret-scanning-review:
    name: Secret Scanning Review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: konfidence-project/.github/.github/workflows/secret-scanning-review.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # metadata only, no PR checkout
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

  codeql-status:
    name: CodeQL Status
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check CodeQL result for the exact PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 20); do
            CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_SHA/check-runs?check_name=CodeQL&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-advanced-security")] | first | .conclusion')
            echo "Attempt $i: CodeQL conclusion: $CONCLUSION"
            case "$CONCLUSION" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required) exit 1 ;;
              neutral|skipped)
                echo 'CodeQL did not analyze this commit (no analyzable code changes)'; exit 0 ;;
            esac
            sleep 30
          done
          echo 'CodeQL did not complete within 10 minutes'
          exit 1

  ci-gate:
    name: CI Gate
    needs: [lint-test-build, secret-scanning-review, codeql-status]
    if: always()
    uses: konfidence-project/.github/.github/workflows/ci-gate.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
    with:
      needs-json: ${{ toJson(needs) }}
