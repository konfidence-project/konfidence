name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@v4
    secrets: inherit

  test-star:
    name: Test Star
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-star

  test-galaxy:
    name: Test Galaxy
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-galaxy

  test-pkg:
    name: Test Pkg
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test-pkg

  build:
    name: Build
    runs-on: konfidence-large
    needs: [test-star, test-galaxy, test-pkg] # TODO: add lint dependency back when linting is fixed
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Generate manifests
        run: make api

      - name: Verify no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make api' and commit the result."
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Bake
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-star
      - test-galaxy
      - test-pkg
      - build
    if: always()
    steps:
      - name: Fail if any job failed or cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          CI_FAILED=$(echo "$NEEDS_JSON" | jq -r '
          to_entries[]
          | select(.value.result == "failure" or .value.result == "cancelled")
          | .key
          ')

          if [ -n "$CI_FAILED" ]; then
          echo "Failed jobs:"
          echo "$CI_FAILED"
          exit 1
          fi

          echo "All required jobs passed or were skipped"
