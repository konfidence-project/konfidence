apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: stageconfiguration.konfidence.cloud.export
spec:
  resources:
    - group: global.konfidence.cloud
      name: stageconfigurations
      schema: v1a.stageconfigurations.global.konfidence.cloud
      storage:
        crd: {}
  permissionClaims:
    - group: ""
      resource: configmaps
      verbs: ["get", "list", "watch", "create", "update"]
    - group: ""
      resource: secrets
      verbs: ["get", "list", "watch", "create", "update"]  
    - group: "events.k8s.io"
      resource: events
      verbs: [ "get", "list", "create", "update", "patch"]

      