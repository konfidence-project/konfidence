---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landscape-vector-activation-manager
rules:
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - activationtaskexecutions
  - vectoractivations
  verbs:
