{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "star.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "star.crdLabels" . | nindent 4 }}
  name: vectordata.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: VectorData
    listKind: VectorDataList
    plural: vectordata
    singular: vectordata
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VectorData is the schema for the vectordata API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VectorDataSpec is the LCP→landscape-orchestrator contract for vector-scoped data.
              Star resolves the OCM envelope `{features, authored}` and aggregates per-AD
              DeploymentResults; the landscape orchestrator materialises the payload on its
              target runtime (ConfigMap on K8s, etc.).
            properties:
              authored:
                description: Authored carries the optional "authored" subset of the
                  OCM envelope, verbatim JSON.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              deploymentResults:
                additionalProperties:
                  description: |-
                    DeploymentResult contains a single output produced by a deployer. These results are used to transport information
                    from the deployer to later phases of the vector lifecycle.
                  properties:
                    name:
                      description: Name is a unique identifier for the result within
                        an ArtifactDeploymentStatus.
                      type: string
                    spec:
                      description: Spec contains deployer-specific structured data.
                        Its format is determined by the Type field.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      description: Type describes the structure contained in Spec.
                        Each deployer may define multiple result types.
                      type: string
                  required:
                  - name
                  - spec
                  - type
                  type: object
                description: |-
                  DeploymentResults aggregated from underlying ArtifactDeployments, keyed
                  "<componentName>/<resultName>".
                type: object
              features:
                description: Features carries the optional "features" subset of the
                  OCM envelope, verbatim JSON.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
            x-kubernetes-validations:
            - message: VectorData spec is immutable after it has been set
              rule: self == oldSelf
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: Spec is required once set
          rule: '!has(oldSelf.spec) || has(self.spec)'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
