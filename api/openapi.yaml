openapi: "3.0.3"

info:
  title: Konfidence API
  version: "1"
  description: >
    HTTP gateway between CLI/UI clients and the Konfidence CRDs.

servers:
  - url: /api
    description: Stage resources (versioned API)

security:
  - sessionCookie: []

paths:
  /v1/login:
    get:
      operationId: loginV1
      summary: Initiate OIDC login
      description: >
        Redirects the browser to the IDP authorization endpoint, beginning the
        PKCE auth flow. On successful authentication the IDP redirects back to
        /api/v1/auth/callback.
      tags: [auth]
      security: []
      parameters:
        - name: return_url
          in: query
          description: Fully qualified URL to redirect to after login. The URL must be present in the API server allowlist.
          required: true
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          description: PKCE S256 challenge used for CLI login.
          required: false
          schema:
            type: string
            minLength: 43
            maxLength: 128
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "302":
          description: Redirect to IDP authorization endpoint.
          headers:
            Location:
              description: Redirect url
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/callback:
    get:
      operationId: authCallbackV1
      summary: OIDC callback
      description: >
        Receives the authorization code from the IDP after successful login.
        Exchanges the code for tokens and establishes a session cookie.
      tags: [auth]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the application after successful authentication.
          headers:
            Set-Cookie:
              description: Contains the session ID.
              schema:
                type: string
            Location:
              description: Redirect url
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/logout:
    post:
      operationId: logoutV1
      summary: Terminate the current session
      description: Clears the session cookie. Requires an active session.
      tags: [auth]
      responses:
        "200":
          description: Session terminated successfully.
          headers:
            Set-Cookie:
              description: Removes the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/identity:
    get:
      operationId: getIdentityV1
      summary: Get the current user identity
      description: Returns identity claims for the authenticated session.
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/exchange:
    post:
      operationId: postExchangeCodeV1
      summary: Send temp exchange code and PKCE verifier to get session
      description: Validates code and verifier and returns session if valid.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ code, verifier ]
              properties:
                code:
                  type: string
                verifier:
                  type: string

      responses:
        "200":
          description: Session established.
          headers:
            Set-Cookie:
              description: Contains the session id.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects:
    get:
      operationId: listProjectsV1
      summary: List all projects
      description: Returns all Project resources visible to the authenticated user.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/landscapes:
    get:
      operationId: listLandscapesV1
      summary: List all landscapes for a specific project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
      description: Returns all landscape resources for a project.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandscapeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/stages:
    get:
      operationId: listStagesV1
      summary: List all stages for a project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/LandscapeQueryId"
      description: >
        Returns all stage resources for a project. Can be filtered by landscape:
        a landscapeId that does not name a landscape of the project is reported as
        404, while a landscape that exists but holds no stages returns an empty list.
      tags: [projects]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/vectorDeployments:
    get:
      operationId: listVectorDeploymentsV1
      summary: List all vectorDeployments for a project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/LandscapeQueryId"
      description: Returns all vectorDeployments resources for a project. Can be filtered by landscape.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorDeploymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/vectorPromotionConfigs:
    get:
      operationId: listVectorPromotionConfigsV1
      summary: List all vectorPromotionConfigs for a project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
      description: Returns all vectorPromotionConfigs resources for a project.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorPromotionConfigList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/vectorPromotionConfigs/{vectorPromotionConfigId}:
    get:
      operationId: getVectorPromotionConfigV1
      summary: Get a single vectorPromotionConfig for a project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/VectorPromotionConfigPathId"
      description: Returns a vectorPromotionConfig resource for a project.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorPromotionConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/vectorPromotions/{vectorPromotionId}/approve:
    post:
      operationId: approveVectorPromotionV1
      summary: Approves the given vectorPromotion for the specified project
      description: >
        Grants approval for a vectorPromotion that has an approval gate. Approving
        an already-approved promotion is idempotent and returns 204. Returns 409
        when the promotion is superseded, finished, or requires no approval.
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/VectorPromotionPathId"
      tags: [projects]
      responses:
        "204":
          description: VectorPromotion successfully approved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/projects/{projectId}/vectorPromotions/{vectorPromotionId}:
    get:
      operationId: getVectorPromotionV1
      summary: Get a single vectorPromotion for a project.
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/VectorPromotionPathId"
      description: Returns a single vectorPromotion resource for a project.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorPromotion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /v1/projects/{projectId}/artifactDeployments:
    get:
      operationId: listArtifactDeploymentsV1
      summary: List all artifactDeployments for a project.
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/LandscapeQueryId"
        - $ref: "#/components/parameters/VectorDeploymentQueryId"
      description: Returns all artifactDeployments resources for a project. Can be filtered by landscape or vectorDeployment.
      tags: [ projects ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDeploymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kden-session

  parameters:
    ProjectPathId:
      name: projectId
      in: path
      required: true
      description: Project Id
      schema:
        type: string
    LandscapePathId:
      name: landscapeId
      in: path
      required: true
      description: Landscape Id
      schema:
        type: string
    VectorPromotionPathId:
      name: vectorPromotionId
      in: path
      required: true
      description: VectorPromotion Id
      schema:
        type: string
    VectorPromotionConfigPathId:
      name: vectorPromotionConfigId
      in: path
      required: true
      description: VectorPromotionConfig Id
      schema:
        type: string
    LandscapeQueryId:
      name: landscapeId
      in: query
      required: false
      description: Filter by landscapeId
      schema:
        type: string
    VectorDeploymentQueryId:
      name: vectorDeploymentId
      in: query
      required: false
      description: Filter by vectorDeploymentId
      schema:
        type: string


  schemas:
    ProjectList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    Project:
      type: object
      required: [ id, name ]
      properties:
        id:
          $ref: "#/components/schemas/ProjectId"
        name:
          type: string
          description: The name of the project

    LandscapeList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Landscape"

    Landscape:
      type: object
      required: [ id, name ]
      properties:
        id:
          $ref: "#/components/schemas/LandscapeId"
        name:
          type: string
          description: The name of the landscape

    VectorDeploymentList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VectorDeployment"

    VectorDeployment:
      type: object
      required: [ id, landscapeId, stageId, vector, status ]
      properties:
        id:
          $ref: "#/components/schemas/VectorDeploymentId"
        landscapeId:
          $ref: "#/components/schemas/LandscapeId"
        stageId:
          $ref: "#/components/schemas/StageId"
        vector:
          $ref: "#/components/schemas/VectorReference"
        status:
          type: string
          enum: [DeployingVector, DeploymentReady, DeploymentFailed]
          description: The vectorDeployment status

    ArtifactDeploymentList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactDeployment"

    ArtifactDeployment:
      type: object
      required: [ id, landscapeId, vectorDeploymentIds, stageIds, artifact, status ]
      properties:
        id:
          $ref: "#/components/schemas/ArtifactDeploymentId"
        landscapeId:
          $ref: "#/components/schemas/LandscapeId"
        vectorDeploymentIds:
          type: array
          minLength: 1
          items:
            $ref: "#/components/schemas/VectorDeploymentId"
        stageIds:
          type: array
          minLength: 1
          items:
            $ref: "#/components/schemas/StageId"
        artifact:
          $ref: "#/components/schemas/ArtifactReference"
        status:
          type: string
          enum: [ArtifactFetched, ArtifactDeployed, AppHealthy, Ready]
          description: The artifactDeployment status

    VectorPromotionConfigList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VectorPromotionConfig"

    VectorPromotionConfig:
      type: object
      required: [ id, source, target, promotions ]
      properties:
        id:
          $ref: "#/components/schemas/VectorPromotionConfigId"
        source:
          $ref: "#/components/schemas/PromotionSourceReference"
        target:
          $ref: "#/components/schemas/PromotionTargetReference"
        ttlAfterFinished:
          type: string
        keepLastPromotions:
          type: integer
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/VectorPromotion"

    VectorPromotion:
      type: object
      required: [ id, source, target, vector ]
      properties:
        id:
          $ref: "#/components/schemas/VectorPromotionId"
        source:
          $ref: "#/components/schemas/PromotionSourceReference"
        target:
          $ref: "#/components/schemas/PromotionTargetReference"
        vector:
          type: string
        status:
          type: string
          enum: [Waiting, Ready, InProgress, Blocked, Succeeded, Failed, Superseded]
        requireApproval:
          type: boolean
        ttlAfterFinished:
          type: string
        sequence:
          type: integer
          format: int64
        approval:
          $ref: "#/components/schemas/PromotionApproval"

    PromotionApproval:
      type: object
      required: [ approvedBy, approvedAt ]
      properties:
        approvedBy:
          type: string
          description: Identity that granted the approval
        approvedAt:
          type: string
          format: date-time
          description: Time the approval was granted

    PromotionSourceReference:
      type: object
      required: [ kind, name ]
      properties:
        kind:
          type: string
          enum: [ Stage, VectorTemplate ]
          description: Promotion source kind
        name:
          type: string
          description: Promotion source name
        landscape:
          type: string
          description: Promotion source landscape

    PromotionTargetReference:
      type: object
      required: [ kind, name, landscape ]
      properties:
        kind:
          type: string
          enum: [Stage]
          description: Promotion target kind
        name:
          type: string
          description: Promotion target name
        landscape:
          type: string
          description: Promotion target landscape

    StageVersion:
      type: object
      required: [id, vector, stageGeneration, status]
      properties:
        id:
          $ref: "#/components/schemas/StageVersionId"
        vector:
          type: string
          description: StageVersion vector
        stageGeneration:
          type: integer
          description: Generation of the parent stage
        status:
          type: string
          enum: [PendingDeployment, DeployingVector, MigratingVector, ActivatingVector, Ready, Failed]
          description: >
            Derived rollout state of the stageVersion.
            PendingDeployment: created, vector deployment not yet started.
            DeployingVector: vector deployment in progress.
            MigratingVector: migration tasks running.
            ActivatingVector: activation tasks running (transient).
            Ready: fully rolled out.
            Failed: reserved for failure detection; not emitted yet.

    StageList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Stage"

    Stage:
      type: object
      required: [id, name, landscapeId]
      properties:
        id:
          $ref: "#/components/schemas/StageId"
        name:
          type: string
          description: The stage name
        landscapeId:
          $ref: "#/components/schemas/LandscapeId"
        targetStageVersion:
          description: The StageVersion the stage's current spec is converging to. Absent while it has not been created yet.
          allOf:
            - $ref: "#/components/schemas/StageVersion"
        activeStageVersion:
          description: The currently active StageVersion. Absent while nothing has been activated.
          allOf:
            - $ref: "#/components/schemas/StageVersion"

    Identity:
      type: object
      required: [name, givenName, familyName, email, projectRoles]
      properties:
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        projectRoles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ArtifactReference:
      allOf:
        - $ref: "#/components/schemas/ComponentReference"

    VectorReference:
      allOf:
        - $ref: "#/components/schemas/ComponentReference"

    ComponentReference:
      type: object
      required: [repository, componentName, componentVersion]
      properties:
        repository:
          type: string
        componentName:
          type: string
        componentVersion:
          type: string

    ProjectId:
      type: string
      description: The project id

    LandscapeId:
      type: string
      description: The landscape id

    VectorDeploymentId:
      type: string
      description: The vectorDeployment id

    ArtifactDeploymentId:
      type: string
      description: The artifactDeployment id

    VectorPromotionConfigId:
      type: string
      description: The vectorPromotionConfig id

    VectorPromotionId:
      type: string
      description: The vectorPromotion id

    StageId:
      type: string
      description: The stage id

    StageVersionId:
      type: string
      description: The stageVersion id

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
