---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landscape-task-orchestration-manager
rules:
- apiGroups:
  - star.konfidence.cloud
  resources:
  - artifactdeployments
  - stageversions
  - stageversionusages
  - taskexecutions
  - vectordeployments
  - vectormigrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - star.konfidence.cloud
  resources:
  - artifactdeployments/status
  - stageversions/status
  - stageversionusages/status
  - taskexecutions/status
  - vectordeployments/status
  - vectormigrations/status
  verbs:
  - get
  - patch
  - update
