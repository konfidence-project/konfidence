openapi: "3.0.3"

info:
  title: Konfidence API
  version: v1
  description: >
    HTTP gateway between CLI/UI clients and the Konfidence star cluster CRDs.

servers:
  - url: /api/v1
    description: Stage resources (versioned API)

paths:
  /healthz:
    get:
      operationId: getHealthStatus
      summary: Health status endpoint
      description: Indicates if the api service is healthy
      tags: [ info ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadinessStatus
      summary: Readiness status endpoint
      description: Indicates if the api service is ready for traffic
      tags: [ info ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /login:
    get:
      operationId: login
      summary: Initiate OIDC login
      description: >
        Redirects the browser to the IDP authorization endpoint, beginning the
        PKCE auth flow. On successful authentication the IDP redirects back to
        /api/v1/auth/callback.
      tags: [auth]
      responses:
        "302":
          description: Redirect to IDP authorization endpoint.

  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback
      description: >
        Receives the authorization code from the IDP after successful login.
        Exchanges the code for tokens and establishes a session cookie.
      tags: [auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the application after successful authentication.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /logout:
    post:
      operationId: logout
      summary: Terminate the current session
      description: Clears the session cookie. Requires an active session.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session terminated successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /identity:
    get:
      operationId: getIdentity
      summary: Get the current user identity
      description: Returns identity claims for the authenticated session.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /exchange:
    post:
      operationId: postExchangeCode
      summary: Send temp exchange code and PKCE verifier to get session
      description: Validates code and verifier and returns session if valid.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                verifier:
                  type: string

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    get:
      operationId: listProjects
      summary: List all projects
      description: Returns all Project resources visible to the authenticated user.
      tags: [ projects ]
      security:
        - sessionCookie: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/landscapes:
    get:
      operationId: listLandscapes
      summary: List all landscapes for a specific project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
      description: Returns all landscape resources for a project.
      tags: [ projects ]
      security:
        - sessionCookie: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandscapeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/stages:
    get:
      operationId: listStages
      summary: List all stages for a project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/LandscapeQueryId"
      description: Returns all stage resources for a project. Can be filtered by landscape.
      tags: [projects]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/vectorDeployments:
    get:
      operationId: listVectorDeployments
      summary: List all vectorDeployments for a project
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/LandscapeQueryId"
      description: Returns all vectorDeployments resources for a project. Can be filtered by landscape.
      tags: [ projects ]
      security:
        - sessionCookie: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorDeploymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/artifactDeployments:
    get:
      operationId: listArtifactDeployments
      summary: List all artifactDeployments for a project.
      parameters:
        - $ref: "#/components/parameters/ProjectPathId"
        - $ref: "#/components/parameters/LandscapeQueryId"
        - $ref: "#/components/parameters/VectorDeploymentQueryId"
      description: Returns all artifactDeployments resources for a project. Can be filtered by landscape or vectorDeployment.
      tags: [ projects ]
      security:
        - sessionCookie: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDeploymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kden_session

  parameters:
    ProjectPathId:
      name: projectId
      in: path
      required: true
      description: Project Id
      schema:
        type: string
    LandscapePathId:
      name: landscapeId
      in: path
      required: true
      description: Landscape Id
      schema:
        type: string
    LandscapeQueryId:
      name: landscapeId
      in: query
      required: false
      description: Filter by landscapeId
      schema:
        type: string
    VectorDeploymentQueryId:
      name: vectorDeploymentId
      in: query
      required: false
      description: Filter by vectorDeploymentId
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required: [ status ]
      properties:
        status:
          type: string

    ReadinessStatus:
      allOf:
        - $ref: "#/components/schemas/HealthStatus"

    ProjectList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    Project:
      type: object
      required: [ id, name ]
      properties:
        id:
          $ref: "#/components/schemas/ProjectId"
        name:
          type: string
          description: The name of the project

    LandscapeList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Landscape"

    Landscape:
      type: object
      required: [ id, name ]
      properties:
        id:
          $ref: "#/components/schemas/LandscapeId"
        name:
          type: string
          description: The name of the landscape

    VectorDeploymentList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VectorDeployment"

    VectorDeployment:
      type: object
      required: [ id, landscapeId, stageId, vector, status ]
      properties:
        id:
          $ref: "#/components/schemas/VectorDeploymentId"
        landscapeId:
          $ref: "#/components/schemas/LandscapeId"
        stageId:
          $ref: "#/components/schemas/StageId"
        vector:
          $ref: "#/components/schemas/VectorReference"
        status:
          type: string
          # TODO add status values
          enum: [VectorDownloaded, ArtifactDeploymentCreated]
          description: The vectorDeployment status

    ArtifactDeploymentList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactDeployment"

    ArtifactDeployment:
      type: object
      required: [ id, landscapeId, vectorDeploymentIds, stageIds, artifact, status ]
      properties:
        id:
          $ref: "#/components/schemas/ArtifactDeploymentId"
        landscapeId:
          $ref: "#/components/schemas/LandscapeId"
        vectorDeploymentIds:
          type: array
          minLength: 1
          items:
            $ref: "#/components/schemas/VectorDeploymentId"
        stageIds:
          type: array
          minLength: 1
          items:
            $ref: "#/components/schemas/StageId"
        artifact:
          $ref: "#/components/schemas/ArtifactReference"
        status:
          type: string
          # TODO add status values
          enum: [ArtifactFetched, ArtifactDeployed]
          description: The artifactDeployment status

    StageVersion:
      type: object
      required: [id, vector, stageGeneration, active, status]
      properties:
        id:
          $ref: "#/components/schemas/StageVersionId"
        vector:
          type: string
          description: StageVersion vector
        stageGeneration:
          type: integer
          description: Generation of the parent stage
        active:
          type: boolean
          description: Indicates if this is the latest active stageVersion
        status:
          type: string
          # TODO define states
          enum: [DeploymentCreated]

    StageList:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Stage"

    Stage:
      type: object
      required: [id, name, landscapeId, targetStageVersion]
      properties:
        id:
          $ref: "#/components/schemas/StageId"
        name:
          type: string
          description: The stage name
        landscapeId:
          $ref: "#/components/schemas/LandscapeId"
        targetStageVersion:
          $ref: "#/components/schemas/StageVersion"

    Identity:
      type: object
      required: [name, givenName, familyName, email, roles]
      properties:
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        middleName:
          type: string
        email:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: string

    Session:
      type: object
      required: [id]
      properties:
        id:
          type: string

    ArtifactReference:
      allOf:
        - $ref: "#/components/schemas/ComponentReference"

    VectorReference:
      allOf:
        - $ref: "#/components/schemas/ComponentReference"

    ComponentReference:
      type: object
      required: [repository, componentName, componentVersion]
      properties:
        repository:
          type: string
        componentName:
          type: string
        componentVersion:
          type: string

    ProjectId:
      type: string
      description: The project id

    LandscapeId:
      type: string
      description: The landscape id

    VectorDeploymentId:
      type: string
      description: The vectorDeployment id

    ArtifactDeploymentId:
      type: string
      description: The artifactDeployment id

    StageId:
      type: string
      description: The stage id

    StageVersionId:
      type: string
      description: The stageVersion id

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
