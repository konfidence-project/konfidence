name: Workflow security
# PR/merge-group runs are called by pr-pipeline.yaml and included in CI Gate.
on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  lint:
    uses: konfidence-project/.github/.github/workflows/workflow-lint.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
