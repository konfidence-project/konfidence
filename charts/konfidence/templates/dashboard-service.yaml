{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "konfidence.dashboardFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konfidence.dashboardLabels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "konfidence.dashboardSelectorLabels" . | nindent 4 }}
{{- end }}
