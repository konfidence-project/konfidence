{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "konfidence.fullname" . }}-api
  labels:
    {{- include "konfidence.apiLabels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [namespaces, secrets, configmaps]
  verbs: [get, list, watch]
- apiGroups: [konfidence.cloud]
  resources:
  - projects
  - projects/status
  - landscapes
  - landscapes/status
  verbs: [get, list, watch]
- apiGroups: [konfidence.cloud]
  resources:
  - vectorpromotionconfigs
  - vectorpromotionconfigs/status
  - vectorpromotions
  - vectorpromotions/status
  - vectortemplates
  - vectortemplates/status
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [konfidence.cloud]
  resources:
  - activationtaskexecutions
  - activationtaskexecutions/status
  - activationtaskregistrations
  - activationtaskregistrations/status
  - artifactdeployments
  - artifactdeployments/status
  - stages
  - stages/status
  - stageversions
  - stageversions/status
  - stageversionusages
  - stageversionusages/status
  - taskexecutions
  - taskexecutions/status
  - vectoractivations
  - vectoractivations/status
  - vectorassignments
  - vectorassignments/status
  - vectordeployments
  - vectordeployments/status
  - vectormigrations
  - vectormigrations/status
  verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
