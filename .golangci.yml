version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    lll:
      line-length: 160
    goimports:
      local-prefixes: konfidence.cloud
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
        - name: import-alias-naming
          arguments:
            - "^[a-z][a-z0-9]*$"
  exclusions:
    generated: lax
    rules:
      # Exclude generated files from all linters
      - path: "zz_generated\\.deepcopy\\.go"
        linters:
          - unused
          - ineffassign
          - revive
      # kubebuilder marker annotations cannot be split across lines
      - path: "api/galaxy/v1alpha1/signing_types\\.go"
        linters:
          - lll
      # Allow dot-imports in test files (conventional for ginkgo/gomega)
      - path: "_test\\.go"
        text: "should not use dot imports"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
