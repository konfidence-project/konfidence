name: PR
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  workflow-security:
    name: Workflow Security
    uses: ./.github/workflows/workflow-lint.yaml

  lint-test-build:
    name: PR
    uses: ./.github/workflows/lint-test-build.yaml

  codeql-status:
    name: CodeQL Status
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check CodeQL result for the exact PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 20); do
            CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_SHA/check-runs?check_name=CodeQL&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-advanced-security")] | first | .conclusion')
            echo "Attempt $i: CodeQL conclusion: $CONCLUSION"
            case "$CONCLUSION" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required) exit 1 ;;
              neutral|skipped)
                echo 'CodeQL did not analyze this commit (no analyzable code changes)'; exit 0 ;;
            esac
            sleep 30
          done
          echo 'CodeQL did not complete within 10 minutes'
          exit 1

  ci-gate:
    name: CI Gate
    needs: [workflow-security, lint-test-build, codeql-status]
    if: always()
    uses: konfidence-project/.github/.github/workflows/ci-gate.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      needs-json: ${{ toJson(needs) }}
