name: Workflow security
# PR/merge-group runs are called by pr-pipeline.yaml and included in CI Gate.
on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  lint:
    uses: konfidence-project/.github/.github/workflows/workflow-lint.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
