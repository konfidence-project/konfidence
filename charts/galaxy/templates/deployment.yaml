apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "galaxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "galaxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "galaxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "galaxy.selectorLabels" . | nindent 8 }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "galaxy.serviceAccountName" . }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - operator
            - --controllers={{ .Values.controller.controllers }}
            - --leader-elect={{ .Values.controller.leaderElection }}
            - --lease-id={{ .Values.controller.leaseId }}
            - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
            {{- if .Values.controller.kcpEndpointSliceName }}
            - --kcp-endpoint-slice-name={{ .Values.controller.kcpEndpointSliceName }}
            {{- end }}
            {{- if .Values.controller.kubernetesHost }}
            - --kubernetes-host={{ .Values.controller.kubernetesHost }}
            {{- end }}
            {{- if gt (int .Values.controller.kubernetesPort) 0 }}
            - --kubernetes-port={{ .Values.controller.kubernetesPort }}
            {{- end }}
            {{- toYaml .Values.extraArgs | nindent 12 }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ include "galaxy.bindAddressPort" .Values.controller.healthProbeBindAddress }}
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
