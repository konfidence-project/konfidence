{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: vectorpromotionconfigs.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    kind: VectorPromotionConfig
    listKind: VectorPromotionConfigList
    plural: vectorpromotionconfigs
    singular: vectorpromotionconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Indicates if the config's references resolve
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Last promotion succeeded
      jsonPath: .status.lastPromotionConditions[?(@.type=="Succeeded")].status
      name: Last-Succeeded
      type: string
    - description: Last promotion condition reason
      jsonPath: .status.lastPromotionConditions[?(@.type=="Succeeded")].reason
      name: Last-Condition-Reason
      type: string
    - description: Time of the last promotion
      jsonPath: .status.lastPromotionConditions[?(@.type=="Succeeded")].lastTransitionTime
      name: Last-Time
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VectorPromotionConfig describes a promotion flow for a vector
          between a source and a target.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the VectorPromotionConfig.
            properties:
              keepLastPromotions:
                default: 10
                description: |-
                  KeepLastPromotions bounds how many terminal VectorPromotions are
                  retained per config; the oldest beyond the bound are deleted. Retention
                  by count keeps an audit trail even when `ttlAfterFinished` is short.
                format: int32
                minimum: 0
                type: integer
              source:
                description: Source references the resource to promote from.
                properties:
                  kind:
                    description: |-
                      Kind is the kind of the source resource. A `VectorTemplate` source
                      promotes its latest assembled vector automatically; a `Stage` source
                      promotes the vector currently active on that stage and requires approval.
                    enum:
                    - VectorTemplate
                    - Stage
                    type: string
                  landscape:
                    description: |-
                      Landscape is the name of the `Landscape` in the config's namespace whose
                      namespace hosts the referenced `Stage`. Required for `Stage` references;
                      must be omitted for `VectorTemplate` references, which are resolved in
                      the config's namespace.
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the source resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: landscape is required for Stage references and must be
                    omitted for VectorTemplate references
                  rule: (self.kind == 'Stage') == has(self.landscape)
              target:
                description: Target references the Stage to promote to.
                properties:
                  kind:
                    description: Kind is the kind of the target resource.
                    enum:
                    - Stage
                    type: string
                  landscape:
                    description: |-
                      Landscape is the name of the `Landscape` in the config's namespace whose
                      namespace hosts the target `Stage`.
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target `Stage`.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - landscape
                - name
                type: object
              ttlAfterFinished:
                description: |-
                  TTLAfterFinished will be copied onto every VectorPromotion the drift
                  controller creates for this config (pending the ADR-0032 rework). See
                  `VectorPromotionSpec.TTLAfterFinished`.
                type: string
            required:
            - source
            - target
            type: object
          status:
            description: VectorPromotionConfigStatus defines the observed state of
              VectorPromotionConfig.
            properties:
              conditions:
                description: |-
                  Conditions reports on the config itself, e.g. whether its references
                  resolve to existing resources. Promotion results are reported separately
                  in `LastPromotionConditions`.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastPromotionConditions:
                description: LastPromotionConditions contains the result of the most
                  recent VectorPromotion execution
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSuccessfulPromotionConditions:
                description: LastSuccessfulPromotionConditions contains the result
                  of the most recent VectorPromotion execution, that was successful
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              sequence:
                description: |-
                  Sequence is the monotonic counter of promotions created for this config.
                  The config reconciler increments it and stamps the value into each
                  created promotion's `spec.sequence`.
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: Spec is required once set
          rule: '!has(oldSelf.spec) || has(self.spec)'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
