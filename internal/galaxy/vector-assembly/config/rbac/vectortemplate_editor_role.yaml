# This rule is not used by the project hackathon-vector-assembly itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the global.konfidence.cloud.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hackathon-vector-assembly
    app.kubernetes.io/managed-by: kustomize
  name: vectortemplate-editor-role
rules:
- apiGroups:
  - global.konfidence.cloud
  resources:
  - vectortemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - global.konfidence.cloud
  resources:
  - vectortemplates/status
  verbs:
  - get
