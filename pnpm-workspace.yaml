packages:
  - apps/konfidence-mock-api
  - apps/konfidence-ui
  - apps/konfidence-ui-prototype
# image-size <=2.0.2 (build-time transitive of less) has no patched release;
# drop these ignores once upstream ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
overrides:
  cookie@<0.7.0: ^0.7.0
  js-yaml@<4.3.1: ^4.3.1
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
