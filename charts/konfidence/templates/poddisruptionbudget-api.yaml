{{- if and .Values.api.enabled .Values.api.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "konfidence.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "konfidence.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if ne .Values.api.podDisruptionBudget.minAvailable nil }}
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  {{- else if ne .Values.api.podDisruptionBudget.maxUnavailable nil }}
  maxUnavailable: {{ .Values.api.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  {{- fail "api.podDisruptionBudget.enabled is true but neither minAvailable nor maxUnavailable is set" }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "konfidence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
