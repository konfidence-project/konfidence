name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    uses: konfidence-project/.github/.github/workflows/kubebuilder-release-pipeline.yaml@v3
    secrets: inherit
    with:
      skip-build: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write
