{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: stages.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: Stage
    listKind: StageList
    plural: stages
    singular: stage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: Age
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.vector
      name: Vector
      type: string
    - description: The currently active StageVersion
      jsonPath: .status.activeStageVersion.name
      name: Active-Version
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Stage is the Schema for the stages API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StageSpec defines the desired state of Stage.
            properties:
              credentials:
                description: |-
                  Credentials supplies credentials for OCM repositories accessed when deploying this stage's vector.
                  Written by the promotion execution controller; not user-settable.
                properties:
                  ocm:
                    description: |-
                      OCMCredentials lists Secrets holding `.ocmconfig` or `.dockerconfigjson` data.
                      All references are same-namespace.
                    properties:
                      refs:
                        items:
                          description: CredentialRef references a Secret in the same
                            namespace as the holding resource.
                          properties:
                            name:
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        minItems: 1
                        type: array
                    required:
                    - refs
                    type: object
                type: object
                x-kubernetes-validations:
                - message: at least one credential surface must be set
                  rule: has(self.ocm)
              vector:
                description: Vector points to the OCM component version that contains
                  the deployment vector for this stage.
                minLength: 1
                type: string
              verifyArtifacts:
                description: |-
                  VerifyArtifacts lists candidate signatures evaluated against every artifact in this stage's vector.
                  Written by the promotion execution controller; not user-settable.
                properties:
                  signatures:
                    items:
                      description: |-
                        Signature pins parameters of one named signature on a component
                        descriptor. Used both for verification (matched against the fetched
                        descriptor) and for signing (overrides defaults of the emitted
                        signature).
                      properties:
                        algorithm:
                          description: |-
                            Algorithm specifies the RSA signing algorithm.
                            When omitted, RSASSA-PSS is used.
                            Valid values: RSASSA-PSS, RSASSA-PKCS1-V1_5.
                          type: string
                        hashAlgorithm:
                          description: |-
                            HashAlgorithm specifies the digest algorithm used when hashing the component descriptor.
                            When omitted, SHA-256 is used.
                            Valid values: SHA-256, SHA-512.
                          type: string
                        issuer:
                          description: |-
                            Issuer pins the expected certificate issuer DN for PEM-encoded signatures.
                            On the sign path the value is stamped into the descriptor alongside the signature,
                            so it is enforced automatically on the verify path even without an explicit pin here.
                            On the verify path, when set, this value overrides whatever the descriptor stored and
                            the handler rejects any signature whose leaf certificate issuer DN does not match.
                            When omitted on both paths the issuer field stays empty and no DN check is performed.
                            Must be non-empty when present.
                          type: string
                        name:
                          description: Name is the unique identifier for this signature.
                          minLength: 1
                          type: string
                        normalisationAlgorithm:
                          description: |-
                            NormalisationAlgorithm specifies the normalisation scheme applied to the descriptor
                            before hashing.
                            When omitted, jsonNormalisation/v4alpha1 is used.
                            Valid values: jsonNormalisation/v4alpha1.
                          type: string
                        signatureMediaType:
                          description: |-
                            SignatureMediaType specifies the encoding format for the signature bytes.
                            When omitted, application/x-pem-file (PEM) is used.
                            Valid values: application/x-pem-file, application/vnd.ocm.signature.rsa.pss,
                            application/vnd.ocm.signature.rsa.
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: 'algorithm must be one of: RSASSA-PSS, RSASSA-PKCS1-V1_5'
                        rule: '!has(self.algorithm) || self.algorithm in [''RSASSA-PSS'',
                          ''RSASSA-PKCS1-V1_5'']'
                      - message: 'signatureMediaType must be one of: application/x-pem-file,
                          application/vnd.ocm.signature.rsa.pss, application/vnd.ocm.signature.rsa'
                        rule: '!has(self.signatureMediaType) || self.signatureMediaType
                          in [''application/x-pem-file'', ''application/vnd.ocm.signature.rsa.pss'',
                          ''application/vnd.ocm.signature.rsa'']'
                      - message: 'hashAlgorithm must be one of: SHA-256, SHA-512'
                        rule: '!has(self.hashAlgorithm) || self.hashAlgorithm in [''SHA-256'',
                          ''SHA-512'']'
                      - message: 'normalisationAlgorithm must be: jsonNormalisation/v4alpha1'
                        rule: '!has(self.normalisationAlgorithm) || self.normalisationAlgorithm
                          in [''jsonNormalisation/v4alpha1'']'
                      - message: issuer must be non-empty when set
                        rule: '!has(self.issuer) || size(self.issuer) > 0'
                    minItems: 1
                    type: array
                required:
                - signatures
                type: object
              verifyVector:
                description: |-
                  VerifyVector lists candidate signatures evaluated against this stage's deployment vector.
                  Written by the promotion execution controller; not user-settable.
                properties:
                  signatures:
                    items:
                      description: |-
                        Signature pins parameters of one named signature on a component
                        descriptor. Used both for verification (matched against the fetched
                        descriptor) and for signing (overrides defaults of the emitted
                        signature).
                      properties:
                        algorithm:
                          description: |-
                            Algorithm specifies the RSA signing algorithm.
                            When omitted, RSASSA-PSS is used.
                            Valid values: RSASSA-PSS, RSASSA-PKCS1-V1_5.
                          type: string
                        hashAlgorithm:
                          description: |-
                            HashAlgorithm specifies the digest algorithm used when hashing the component descriptor.
                            When omitted, SHA-256 is used.
                            Valid values: SHA-256, SHA-512.
                          type: string
                        issuer:
                          description: |-
                            Issuer pins the expected certificate issuer DN for PEM-encoded signatures.
                            On the sign path the value is stamped into the descriptor alongside the signature,
                            so it is enforced automatically on the verify path even without an explicit pin here.
                            On the verify path, when set, this value overrides whatever the descriptor stored and
                            the handler rejects any signature whose leaf certificate issuer DN does not match.
                            When omitted on both paths the issuer field stays empty and no DN check is performed.
                            Must be non-empty when present.
                          type: string
                        name:
                          description: Name is the unique identifier for this signature.
                          minLength: 1
                          type: string
                        normalisationAlgorithm:
                          description: |-
                            NormalisationAlgorithm specifies the normalisation scheme applied to the descriptor
                            before hashing.
                            When omitted, jsonNormalisation/v4alpha1 is used.
                            Valid values: jsonNormalisation/v4alpha1.
                          type: string
                        signatureMediaType:
                          description: |-
                            SignatureMediaType specifies the encoding format for the signature bytes.
                            When omitted, application/x-pem-file (PEM) is used.
                            Valid values: application/x-pem-file, application/vnd.ocm.signature.rsa.pss,
                            application/vnd.ocm.signature.rsa.
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: 'algorithm must be one of: RSASSA-PSS, RSASSA-PKCS1-V1_5'
                        rule: '!has(self.algorithm) || self.algorithm in [''RSASSA-PSS'',
                          ''RSASSA-PKCS1-V1_5'']'
                      - message: 'signatureMediaType must be one of: application/x-pem-file,
                          application/vnd.ocm.signature.rsa.pss, application/vnd.ocm.signature.rsa'
                        rule: '!has(self.signatureMediaType) || self.signatureMediaType
                          in [''application/x-pem-file'', ''application/vnd.ocm.signature.rsa.pss'',
                          ''application/vnd.ocm.signature.rsa'']'
                      - message: 'hashAlgorithm must be one of: SHA-256, SHA-512'
                        rule: '!has(self.hashAlgorithm) || self.hashAlgorithm in [''SHA-256'',
                          ''SHA-512'']'
                      - message: 'normalisationAlgorithm must be: jsonNormalisation/v4alpha1'
                        rule: '!has(self.normalisationAlgorithm) || self.normalisationAlgorithm
                          in [''jsonNormalisation/v4alpha1'']'
                      - message: issuer must be non-empty when set
                        rule: '!has(self.issuer) || size(self.issuer) > 0'
                    minItems: 1
                    type: array
                required:
                - signatures
                type: object
            type: object
          status:
            description: StageStatus defines the observed state of Stage.
            properties:
              activeStageVersion:
                description: |-
                  ActiveStageVersion references the StageVersion whose vector is currently
                  active on this stage, mirrored from the stage's active StageVersionUsage.
                properties:
                  name:
                    description: Name is the name of the StageVersion. Required.
                    type: string
                required:
                - name
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              latestVectorDeploymentRef:
                description: TypedObjectReference contains enough information to let
                  you locate the typed referenced object
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the group for the resource being referenced.
                      If APIGroup is not specified, the specified Kind must be in the core API group.
                      For any other third-party types, APIGroup is required.
                    type: string
                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of resource being referenced
                      Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                      (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                    type: string
                required:
                - kind
                - name
                type: object
              vectorHistory:
                items:
                  type: string
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: vector cannot be cleared after it has been set
          rule: '!has(oldSelf.spec) || !has(oldSelf.spec.vector) || (has(self.spec)
            && has(self.spec.vector))'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
