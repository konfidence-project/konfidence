# permissions for end users to view ocmcomponentversionocis.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crds
    app.kubernetes.io/managed-by: kustomize
  name: common-ocmcomponentversionoci-viewer-role
rules:
- apiGroups:
  - common.konfidence.tools.sap
  resources:
  - ocmcomponentversionocis
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - common.konfidence.tools.sap
  resources:
  - ocmcomponentversionocis/status
  verbs:
  - get
