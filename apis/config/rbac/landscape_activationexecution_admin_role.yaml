# This rule is not used by the project crds itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over landscape.konfidence.cloud.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crds
    app.kubernetes.io/managed-by: kustomize
  name: landscape-activationexecution-admin-role
rules:
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - activationexecutions
  verbs:
  - '*'
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - activationexecutions/status
  verbs:
  - get
