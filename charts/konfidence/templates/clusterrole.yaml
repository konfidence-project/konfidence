{{- if .Values.controller.install -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
{{- include "konfidence.labels" . | nindent 4 }}
  name: {{ include "konfidence.fullname" . }}-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - konfidence.cloud
  resources:
  - activationtaskexecutions
  - activationtaskregistrations
  - artifactdeployments
  - stageconfigurations
  - stages
  - stageversions
  - stageversionusages
  - taskexecutions
  - vectoractivations
  - vectorassignments
  - vectordeployments
  - vectormigrations
  - vectorpromotions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - konfidence.cloud
  resources:
  - activationtaskexecutions/status
  - activationtaskregistrations/status
  - artifactdeployments/status
  - stageconfigurations/status
  - stages/status
  - stageversions/status
  - stageversionusages/status
  - taskexecutions/status
  - vectoractivations/status
  - vectordeployments/status
  - vectormigrations/status
  - vectorpromotionconfigs/status
  - vectorpromotions/status
  - vectortemplates/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - konfidence.cloud
  resources:
  - vectordata
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - konfidence.cloud
  resources:
  - vectordeployments/finalizers
  verbs:
  - update
- apiGroups:
  - konfidence.cloud
  resources:
  - vectorpromotionconfigs
  - vectortemplates
  verbs:
  - get
  - list
  - watch
{{- end }}
