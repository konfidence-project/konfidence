name: Release PR
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    name: Release PR
    uses: konfidence-project/.github/.github/workflows/release-please.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
    secrets:
      KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
  release:
    name: Release
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/lint-test-build.yaml
  publish:
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: konfidence-project/.github/.github/workflows/goreleaser.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # protected release environment
    with:
      mode: release
      snapshot-tag: ${{ needs.release-please.outputs.tag_name }}
  publish-helm-charts:
    name: Publish Helm Charts
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: konfidence-project/.github/.github/workflows/publish-helm-charts.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      charts: charts/konfidence
  publish-release:
    name: Publish Release
    needs: [release-please, publish, publish-helm-charts]
    if: needs.release-please.outputs.release_created == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
