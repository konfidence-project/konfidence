{{- if .Values.crd.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
{{- include "konfidence.crdAnnotations" . | nindent 4 }}
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
{{- include "konfidence.crdLabels" . | nindent 4 }}
  name: landscapes.konfidence.cloud
spec:
  group: konfidence.cloud
  names:
    categories:
    - konfidence
    - kden
    kind: Landscape
    listKind: LandscapeList
    plural: landscapes
    singular: landscape
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - description: The project this landscape belongs to
      jsonPath: .status.projectName
      name: Project
      type: string
    - description: The landscape namespace
      jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Landscape is the Schema for the landscapes API. A Landscape owns a dedicated
          namespace that serves as a deployment target for vectors. Landscapes must be
          created in project namespaces. The landscape name is capped at 46 characters
          so the derived namespace name stays within the 63-character Kubernetes limits.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LandscapeSpec defines the desired state of Landscape.

              The transition rule catches namespace being set or unset after creation;
              changing a set namespace is caught by the field-level rule. The two rules
              are split to stay within the CEL cost budget of the schema.
            properties:
              displayName:
                description: |-
                  DisplayName is the human-readable name of the landscape, shown in user
                  interfaces. It does not affect the namespace name or any label, and it
                  may be changed at any time.
                maxLength: 253
                minLength: 1
                type: string
              namespace:
                description: |-
                  Namespace overrides the name of the namespace created for this landscape.
                  When unset it defaults to "kden-l-<landscape-name>-<hash>". It is
                  immutable once the Landscape exists, because the namespace and everything
                  it holds are bound to this name.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: namespace is immutable
                  rule: self == oldSelf
            type: object
            x-kubernetes-validations:
            - message: namespace is immutable
              rule: has(self.namespace) == has(oldSelf.namespace)
          status:
            description: LandscapeStatus defines the observed state of Landscape.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              namespace:
                description: Namespace is the name of the namespace managed for this
                  landscape.
                type: string
              projectName:
                description: |-
                  ProjectName is the name of the project this landscape belongs to,
                  derived from the namespace where the Landscape CR was created.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: landscape name must be at most 46 characters
          rule: size(self.metadata.name) <= 46
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
