name: Frontend CI

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - apps/konfidence-ui/**
  push:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - apps/konfidence-ui/**

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - &checkout-code
        name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - &install-pnpm
        name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - &install-dependencies
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm ui:verify

  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - *checkout-code
      - *install-pnpm
      - *setup-node
      - *install-dependencies

      - name: Run unit tests
        run: pnpm ui:test:unit -- --reporter=default --reporter=github-actions

  test-browser:
    name: Test Browser
    runs-on: ubuntu-latest
    steps:
      - *checkout-code
      - *install-pnpm
      - *setup-node
      - *install-dependencies

      - &cache-playwright-browsers
        name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/konfidence-ui/package.json') }}

      - name: Install Chromium
        run: pnpm --filter konfidence-ui exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm ui:test:browser -- --reporter=default --reporter=github-actions

      - name: Upload Vitest attachments
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-attachments
          path: apps/konfidence-ui/.vitest-attachments/
          if-no-files-found: ignore
          retention-days: 7

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    steps:
      - *checkout-code
      - *install-pnpm
      - *setup-node
      - *install-dependencies
      - *cache-playwright-browsers

      - name: Install Chromium
        run: pnpm --filter konfidence-ui exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm ui:test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/konfidence-ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *install-pnpm
      - *setup-node
      - *install-dependencies

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dashboard SPA
        run: pnpm ui:build

      - name: Verify static output
        run: test -f apps/konfidence-ui/build/index.html

      - name: Build API binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o linux/amd64/api ./cmd/api

      - name: Build combined API image
        run: docker build --platform=linux/amd64 --build-arg TARGETPLATFORM=linux/amd64 -f Dockerfile.api -t konfidence-api:${{ github.sha }} .

      - name: Smoke-test combined API image
        run: |
          docker run --rm -d --name konfidence-api-smoke -p 18090:8090 \
            -e KUBECONFIG=/kubeconfig \
            -v "$PWD/internal/api/server/testdata/kubeconfig.yaml:/kubeconfig:ro" \
            konfidence-api:${{ github.sha }} --oidc-enabled=false
          trap 'docker stop konfidence-api-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18090/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs konfidence-api-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18090/ | grep --quiet 'display: contents'
          curl --fail --silent http://127.0.0.1:18090/projects/example/landscape | grep --quiet 'display: contents'
          curl --fail --silent http://127.0.0.1:18090/favicon.ico >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18090/api/unknown)" != "200"
