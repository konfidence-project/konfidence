name: Main
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test-build:
    name: Main
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    uses: ./.github/workflows/lint-test-build.yaml
  publish:
    name: Publish images
    needs: [lint-test-build]
    permissions:
      contents: write
      packages: write
    uses: konfidence-project/.github/.github/workflows/goreleaser.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      mode: main
      snapshot-tag: ${{ github.sha }}
  publish-dev-chart:
    name: Publish Dev Helm Chart
    needs: [publish]
    permissions:
      contents: read
      packages: write
    uses: konfidence-project/.github/.github/workflows/publish-helm-charts.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      mode: dev
      charts: charts/konfidence
