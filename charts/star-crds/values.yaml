# Keep CRDs on `helm uninstall` to avoid wiping user CRs.
keepOnUninstall: true

# Apply CRDs as Helm pre-install/pre-upgrade hooks so they land before
# any custom resources or controller pods. Combined with keepOnUninstall,
# the CRDs survive uninstall and stay managed across upgrades.
useHooks: false

