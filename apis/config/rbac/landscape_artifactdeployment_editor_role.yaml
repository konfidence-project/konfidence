# permissions for end users to edit artifactdeployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crds
    app.kubernetes.io/managed-by: kustomize
  name: landscape-artifactdeployment-editor-role
rules:
- apiGroups:
  - landscape.konfidence.tools.sap
  resources:
  - artifactdeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - landscape.konfidence.tools.sap
  resources:
  - artifactdeployments/status
  verbs:
  - get
