name: Release
# Stable releases are chained behind release-please; only manual RC tags here.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+-rc.*']
permissions:
  contents: read
jobs:
  version:
    name: Validate Release Tag
    uses: konfidence-project/.github/.github/workflows/validate-release-tag.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
  lint-test-build:
    name: Release
    needs: [version]
    uses: ./.github/workflows/lint-test-build.yaml
  publish:
    needs: [lint-test-build]
    permissions:
      contents: write
      packages: write
    uses: konfidence-project/.github/.github/workflows/goreleaser.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      mode: release
  publish-helm-charts:
    name: Publish Helm Charts
    needs: [version, publish]
    permissions:
      contents: read
      packages: write
    uses: konfidence-project/.github/.github/workflows/publish-helm-charts.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      version: ${{ needs.version.outputs.version }}
      charts: charts/konfidence
  publish-release:
    name: Publish Release
    needs: [publish, publish-helm-charts]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
