# This rule is not used by the project crds itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to landscape.konfidence.cloud resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crds
    app.kubernetes.io/managed-by: kustomize
  name: landscape-vectoractivation-viewer-role
rules:
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - vectoractivations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - vectoractivations/status
  verbs:
  - get
