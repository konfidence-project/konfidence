name: Release

on:
  push: 
    branches: [main]

# Prevent duplicate runs: cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.head_ref }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Run on all commits, but skip push events when PR is open (to avoid duplicates)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

  test:
    name: Test
    # Run on all commits, but skip push events when PR is open (to avoid duplicates)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: konfidence-project/.github/.github/workflows/kubebuilder-test.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

  release:
    name: Build and Release Go Module
   
    uses: konfidence-project/.github/.github/workflows/go-module-release.yaml@main
    secrets: 
      konfidence-project-repo-access-private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance, not used in our case but still needed for workflow

