name: Release

on:
  push: 
    branches: [main]    



jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@fix/ci-code-review-issues
    secrets: inherit
  test:
      name: Test
      uses: konfidence-project/.github/.github/workflows/kubebuilder-test.yaml@fix/ci-code-review-issues
      secrets: inherit
      with:
        with-kind-cluster: true
        install-crds: true
        crds-version: 6f560b268fa798ee96457551578fe84e90ae2acf

  build-and-release:
    needs:
      - lint
      - test
    name: Build and Release Container Image
    # Only run on main branch or pull requests
    uses: konfidence-project/.github/.github/workflows/kubebuilder-container-build-and-release.yaml@fix/ci-code-review-issues
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write
